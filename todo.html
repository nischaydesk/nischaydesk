<!DOCTYPE html>
<html lang="hi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nischay Tasks | Ultra Premium</title>
  
  <!-- Typography -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    /* 🌟 ULTRA PREMIUM VARIABLES */
    :root {
      --bg-page: #040914;
      --card-bg: rgba(11, 19, 36, 0.65);
      --card-border: rgba(56, 189, 248, 0.15);
      --brand-blue: #0284c7;
      --accent-cyan: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 60px;
    }

    /* 🌟 ANIMATED BACKGROUND GLOW (FLOATING ORBS) */
    .bg-orb-1 { position: fixed; top: -10%; left: -10%; width: 40vw; height: 40vw; background: rgba(2, 132, 199, 0.15); filter: blur(90px); border-radius: 50%; z-index: -1; animation: float 10s ease-in-out infinite alternate; }
    .bg-orb-2 { position: fixed; bottom: -10%; right: -10%; width: 40vw; height: 40vw; background: rgba(16, 185, 129, 0.1); filter: blur(90px); border-radius: 50%; z-index: -1; animation: float 12s ease-in-out infinite alternate-reverse; }
    @keyframes float { 0% { transform: translate(0,0); } 100% { transform: translate(30px, 30px); } }

    /* 🌟 PREMIUM HEADER */
    .todo-header {
      background: rgba(4, 9, 20, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent-cyan);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
      background: rgba(56, 189, 248, 0.1);
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(56, 189, 248, 0.2);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .back-btn:hover { background: rgba(56, 189, 248, 0.2); transform: translateX(-3px); }
    .back-btn:active { transform: scale(0.95); }
    
    .header-title { font-size: 1.2rem; font-weight: 900; color: #fff; letter-spacing: 0.5px; }
    .header-title span { background: linear-gradient(135deg, #38bdf8, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* 🌟 MAIN CONTAINER */
    .todo-container { max-width: 650px; margin: 30px auto; padding: 0 18px; }

    /* 🌟 STATS BOARD (GLASSMORPHISM) */
    .stats-board {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }
    .stats-board::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, #38bdf8, #8b5cf6, #10b981); }
    
    .stats-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 18px; }
    .stats-header h2 { font-size: 1.5rem; font-weight: 900; }
    .stats-header p { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; margin-top: 4px; }
    
    .progress-wrap { display: flex; align-items: center; gap: 16px; }
    .progress-text { font-size: 1.4rem; font-weight: 900; color: var(--accent-cyan); text-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
    .progress-track { flex: 1; height: 12px; background: rgba(0,0,0,0.3); border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #0284c7, #38bdf8, #a855f7); border-radius: 10px; transition: width 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 0 10px rgba(56,189,248,0.5); }

    /* 🌟 INPUT AREA */
    .input-group { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--card-border); border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; box-shadow: 0 15px 30px rgba(0,0,0,0.15); }
    .input-row { display: flex; gap: 10px; }
    
    .task-input { flex: 1; background: rgba(0,0,0,0.2); border: 1px solid transparent; padding: 16px; border-radius: 14px; color: #fff; font-size: 0.95rem; font-weight: 600; outline: none; transition: all 0.3s; }
    .task-input:focus { border-color: rgba(56, 189, 248, 0.5); background: rgba(0,0,0,0.4); box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
    
    .priority-select { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.08); color: #fff; padding: 0 16px; border-radius: 14px; font-weight: 700; font-size: 0.85rem; outline: none; cursor: pointer; transition: all 0.2s; }
    .priority-select:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2); }
    .priority-select option { background: #0f172a; color: #fff; }
    
    .add-btn { background: linear-gradient(135deg, #0284c7, #38bdf8); color: #fff; border: none; padding: 14px 24px; border-radius: 14px; font-size: 0.95rem; font-weight: 800; cursor: pointer; box-shadow: 0 8px 20px rgba(2, 132, 199, 0.3); transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    .add-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(2, 132, 199, 0.4); }
    .add-btn:active { transform: scale(0.95); }

    /* 🌟 LIST HEADER & CLEAR ALL */
    .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 0 4px; }
    .list-title { font-size: 1rem; font-weight: 800; color: #cbd5e1; }
    .clear-all-btn { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); padding: 6px 14px; border-radius: 8px; font-size: 0.75rem; font-weight: 800; cursor: pointer; transition: all 0.2s; display: none; } /* Default hidden, shown via JS */
    .clear-all-btn:hover { background: var(--danger); color: #fff; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); transform: translateY(-1px); }

    /* 🌟 TASK LIST & ITEMS */
    .task-list { list-style: none; display: flex; flex-direction: column; gap: 14px; }

    .task-item {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.05);
      padding: 16px 18px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      animation: slideInUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
    }
    @keyframes slideInUp { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    
    .task-item:hover { transform: translateY(-3px); border-color: rgba(56, 189, 248, 0.3); box-shadow: 0 12px 25px rgba(0,0,0,0.4); }

    .task-item.completed { background: rgba(16, 185, 129, 0.05); border-color: rgba(16, 185, 129, 0.15); opacity: 0.8; }
    .task-item.completed:hover { transform: translateY(0); box-shadow: none; opacity: 1; }
    .task-item.completed .task-text { text-decoration: line-through; color: var(--text-muted); }

    .task-left { display: flex; align-items: center; gap: 16px; flex: 1; }
    
    /* Premium Checkbox */
    .custom-checkbox { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); flex-shrink: 0; position: relative; }
    .custom-checkbox:hover { border-color: var(--accent-cyan); transform: scale(1.1); background: rgba(56, 189, 248, 0.1); }
    .task-item.completed .custom-checkbox { background: var(--success); border-color: var(--success); transform: scale(1); box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
    .custom-checkbox::after { content: '✓'; color: #fff; font-size: 15px; font-weight: 900; position: absolute; opacity: 0; transform: scale(0) rotate(-45deg); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .task-item.completed .custom-checkbox::after { opacity: 1; transform: scale(1) rotate(0); }

    .task-content { display: flex; flex-direction: column; gap: 6px; }
    .task-text { font-size: 0.95rem; font-weight: 700; color: #fff; line-height: 1.4; transition: all 0.3s; }
    
    .priority-badge { font-size: 0.65rem; font-weight: 900; padding: 3px 10px; border-radius: 8px; display: inline-block; width: max-content; letter-spacing: 0.3px; text-transform: uppercase; }
    .p-high { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
    .p-medium { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.3); }
    .p-low { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }

    .delete-btn { background: rgba(255, 255, 255, 0.05); color: var(--text-muted); border: 1px solid transparent; width: 40px; height: 40px; border-radius: 12px; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
    .delete-btn:hover { background: rgba(239, 68, 68, 0.15); color: #f87171; border-color: rgba(239, 68, 68, 0.3); transform: rotate(8deg); }
    .delete-btn:active { transform: scale(0.9); }

    /* Empty State */
    .empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); background: var(--card-bg); border-radius: 24px; border: 1px dashed rgba(255,255,255,0.1); }
    .empty-state h3 { font-size: 1.3rem; color: #fff; margin-bottom: 8px; font-weight: 800; }
    .empty-state p { font-size: 0.9rem; }
    .empty-icon { font-size: 4rem; margin-bottom: 16px; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3)); animation: floatIcon 3s ease-in-out infinite; }
    @keyframes floatIcon { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    /* 🌟 PREMIUM CUSTOM CONFIRMATION POPUP (GLASS MODAL) 🌟 */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 9999;
      display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; visibility: hidden; transition: all 0.3s ease;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    
    .confirm-box {
      background: #0f172a; border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 24px; padding: 30px 24px; width: 100%; max-width: 360px;
      text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 40px rgba(239,68,68,0.15);
      transform: scale(0.9) translateY(20px); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .modal-overlay.active .confirm-box { transform: scale(1) translateY(0); }
    
    .confirm-icon-box { width: 70px; height: 70px; background: rgba(239, 68, 68, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 2rem; border: 2px solid rgba(239, 68, 68, 0.3); box-shadow: 0 10px 25px rgba(239,68,68,0.2); }
    .confirm-title { font-size: 1.4rem; font-weight: 900; color: #fff; margin-bottom: 8px; }
    .confirm-text { font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 24px; }
    .confirm-text strong { color: #f87171; }
    
    .confirm-actions { display: flex; gap: 12px; }
    .btn-cancel { flex: 1; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); padding: 14px; border-radius: 14px; font-weight: 800; cursor: pointer; transition: all 0.2s; }
    .btn-cancel:hover { background: rgba(255,255,255,0.1); }
    .btn-delete-confirm { flex: 1; background: linear-gradient(135deg, #ef4444, #b91c1c); color: #fff; border: none; padding: 14px; border-radius: 14px; font-weight: 800; cursor: pointer; box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4); transition: all 0.2s; }
    .btn-delete-confirm:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(239, 68, 68, 0.5); }
    .btn-delete-confirm:active { transform: scale(0.95); }

    /* 🌟 TOAST NOTIFICATION */
    .toast-box {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px) scale(0.9);
      background: rgba(16, 185, 129, 0.95); backdrop-filter: blur(12px); color: #fff; padding: 14px 28px; border-radius: 50px;
      font-size: 0.95rem; font-weight: 800; display: flex; align-items: center; gap: 12px;
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4); opacity: 0; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 1000;
    }
    .toast-box.show { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
    .toast-box.error { background: rgba(239, 68, 68, 0.95); box-shadow: 0 10px 30px rgba(239, 68, 68, 0.4); }
  </style>
</head>
<body>

  <!-- Background Orbs -->
  <div class="bg-orb-1"></div>
  <div class="bg-orb-2"></div>

  <!-- 🌟 HEADER -->
  <header class="todo-header">
    <a href="index.html" class="back-btn">
      <span>←</span> मुख्य डैशबोर्ड
    </a>
    <div class="header-title">Nischay<span>Tasks</span></div>
  </header>

  <!-- 🌟 MAIN CONTENT -->
  <div class="todo-container">
    
    <!-- STATS BOARD -->
    <div class="stats-board">
      <div class="stats-header">
        <div>
          <h2>आज के टास्क 🎯</h2>
          <p>अपनी पढ़ाई और काम को ट्रैक करें</p>
        </div>
      </div>
      <div class="progress-wrap">
        <div class="progress-text" id="progressText">0/0</div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
    </div>

    <!-- INPUT AREA -->
    <div class="input-group">
      <div class="input-row">
        <input type="text" id="taskInput" class="task-input" placeholder="नया टास्क लिखें... (उदा. मैथ का चैप्टर 1)" autocomplete="off">
      </div>
      <div class="input-row">
        <select id="priorityInput" class="priority-select">
          <option value="high">🔥 High Priority</option>
          <option value="medium" selected>⚡ Medium Priority</option>
          <option value="low">🌱 Low Priority</option>
        </select>
        <button class="add-btn" onclick="addTask()">जोड़ें ➕</button>
      </div>
    </div>

    <!-- LIST HEADER -->
    <div class="list-header">
      <span class="list-title" id="listTitleSpan">आपके टास्क</span>
      <button class="clear-all-btn" id="clearAllBtn" onclick="openDeleteModal(null, true)">🧹 सभी मिटाएं</button>
    </div>

    <!-- TASK LIST -->
    <ul class="task-list" id="taskList">
      <!-- Tasks will be injected here via JS -->
    </ul>

  </div>

  <!-- 🌟 CUSTOM CONFIRMATION POPUP (GLASS MODAL) 🌟 -->
  <div class="modal-overlay" id="confirmModal">
    <div class="confirm-box">
      <div class="confirm-icon-box">🗑️</div>
      <h3 class="confirm-title" id="confirmTitle">कन्फर्म करें</h3>
      <p class="confirm-text" id="confirmText">क्या आप सच में <strong>यह टास्क</strong> मिटाना चाहते हैं? यह वापस नहीं आएगा।</p>
      <div class="confirm-actions">
        <button class="btn-cancel" onclick="closeDeleteModal()">रद्द करें</button>
        <button class="btn-delete-confirm" onclick="executeDeleteAction()">हाँ, मिटा दें</button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toastMsg" class="toast-box">
    <span id="toastIcon">✅</span>
    <span id="toastText">टास्क जुड़ गया!</span>
  </div>

  <!-- 🌟 JAVASCRIPT LOGIC -->
  <script>
    let tasks = JSON.parse(localStorage.getItem('nischay_todo_tasks_v2')) || [];

    const taskInput = document.getElementById('taskInput');
    const priorityInput = document.getElementById('priorityInput');
    const taskList = document.getElementById('taskList');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const toastBox = document.getElementById('toastMsg');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const listTitleSpan = document.getElementById('listTitleSpan');

    // Modal Variables
    const confirmModal = document.getElementById('confirmModal');
    const confirmText = document.getElementById('confirmText');
    let deleteTargetId = null;
    let isDeleteAll = false;

    // 🌟 Initialize App
    function init() {
      renderTasks();
      updateStats();
    }

    // 🌟 Render Tasks
    function renderTasks() {
      taskList.innerHTML = '';

      if (tasks.length === 0) {
        clearAllBtn.style.display = 'none';
        listTitleSpan.style.display = 'none';
        taskList.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">☕</div>
            <h3>शानदार! कोई काम बाकी नहीं।</h3>
            <p>ऊपर बॉक्स में नया टास्क लिखें और प्रोडक्टिव बनें।</p>
          </div>
        `;
        return;
      }

      clearAllBtn.style.display = 'inline-block';
      listTitleSpan.style.display = 'inline-block';

      // Sort: Incomplete first
      const sortedTasks = [...tasks].sort((a, b) => a.completed - b.completed);

      sortedTasks.forEach(task => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        
        let priorityLabel, priorityClass;
        if(task.priority === 'high') { priorityLabel = '🔥 High'; priorityClass = 'p-high'; }
        else if(task.priority === 'medium') { priorityLabel = '⚡ Medium'; priorityClass = 'p-medium'; }
        else { priorityLabel = '🌱 Low'; priorityClass = 'p-low'; }

        li.innerHTML = `
          <div class="task-left">
            <div class="custom-checkbox" onclick="toggleTask(${task.id})"></div>
            <div class="task-content">
              <span class="task-text">${task.text}</span>
              <span class="priority-badge ${priorityClass}">${priorityLabel}</span>
            </div>
          </div>
          <button class="delete-btn" onclick="openDeleteModal(${task.id}, false)" title="डिलीट करें">🗑️</button>
        `;
        taskList.appendChild(li);
      });
    }

    // 🌟 Add New Task
    function addTask() {
      const text = taskInput.value.trim();
      const priority = priorityInput.value;

      if (!text) {
        showToast('कृपया टास्क का नाम लिखें!', 'error');
        return;
      }

      const newTask = {
        id: Date.now(),
        text: text,
        priority: priority,
        completed: false
      };

      tasks.unshift(newTask);
      saveData();
      renderTasks();
      updateStats();
      
      taskInput.value = ''; 
      showToast('नया टास्क जुड़ गया! 🚀', 'success');
    }

    // 🌟 Toggle Task Completion
    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.completed = !task.completed;
        saveData();
        renderTasks();
        updateStats();
        
        if(task.completed) {
          showToast('शाबाश! एक और काम पूरा हुआ 🎉', 'success');
        }
      }
    }

    // 🌟 MODAL LOGIC: Open Confirm Modal
    function openDeleteModal(id, deleteAll = false) {
      deleteTargetId = id;
      isDeleteAll = deleteAll;

      if(isDeleteAll) {
        confirmText.innerHTML = "क्या आप सच में <strong>सभी टास्क</strong> एक साथ मिटाना चाहते हैं? यह वापस नहीं आएगा।";
      } else {
        confirmText.innerHTML = "क्या आप सच में <strong>यह वाला टास्क</strong> मिटाना चाहते हैं?";
      }

      confirmModal.classList.add('active');
    }

    // 🌟 MODAL LOGIC: Close Confirm Modal
    function closeDeleteModal() {
      confirmModal.classList.remove('active');
      deleteTargetId = null;
      isDeleteAll = false;
    }

    // 🌟 MODAL LOGIC: Execute Actual Deletion
    function executeDeleteAction() {
      if(isDeleteAll) {
        tasks = []; // Clear all
        showToast('लिस्ट पूरी तरह साफ़ कर दी गई 🧹', 'error');
      } else if (deleteTargetId !== null) {
        tasks = tasks.filter(t => t.id !== deleteTargetId);
        showToast('टास्क हटा दिया गया 🗑️', 'error');
      }
      
      saveData();
      renderTasks();
      updateStats();
      closeDeleteModal();
    }

    // 🌟 Update Progress Bar & Stats
    function updateStats() {
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;
      
      progressText.textContent = `${completed}/${total}`;
      
      if (total === 0) {
        progressFill.style.width = '0%';
      } else {
        const percentage = (completed / total) * 100;
        progressFill.style.width = `${percentage}%`;
        
        // Color transition logic based on completion %
        if(percentage === 100) {
          progressFill.style.background = 'linear-gradient(90deg, #10b981, #34d399)'; // Full Green
          progressFill.style.boxShadow = '0 0 15px rgba(16,185,129,0.5)';
        } else {
          progressFill.style.background = 'linear-gradient(90deg, #0284c7, #38bdf8, #a855f7)'; // Gradient
          progressFill.style.boxShadow = '0 0 10px rgba(56,189,248,0.5)';
        }
      }
    }

    // 🌟 Save to LocalStorage
    function saveData() {
      localStorage.setItem('nischay_todo_tasks_v2', JSON.stringify(tasks));
    }

    // 🌟 Show Premium Toast
    let toastTimeout;
    function showToast(message, type) {
      clearTimeout(toastTimeout);
      const toastIcon = document.getElementById('toastIcon');
      const toastText = document.getElementById('toastText');
      
      toastText.textContent = message;
      
      if (type === 'error') {
        toastBox.classList.add('error');
        toastIcon.textContent = '⚠️';
      } else {
        toastBox.classList.remove('error');
        toastIcon.textContent = '✅';
      }

      toastBox.classList.add('show');
      
      toastTimeout = setTimeout(() => {
        toastBox.classList.remove('show');
      }, 3000);
    }

    // Enter Key to add task
    taskInput.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') addTask();
    });

    // Start App
    init();
  </script>
</body>
</html>
