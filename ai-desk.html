<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NischayDesk AI Studio</title>

  <!-- Google Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <style>
    :root {
      --bg: #131314;
      --surface: #1e1f20;
      --surface-elevated: #282a2c;
      --text-main: #e3e3e3;
      --text-muted: #c4c7c5;
      --user-bubble: #282a2c;
      --border: #333537;
      --input-bg: #1e1f20;
      --accent: #a8c7fa;
      --blue-btn: #1a73e8;
      --math-bg: #1a2233;
      --math-border: rgba(66, 133, 244, 0.4);
      --dock-shadow: rgba(0, 0, 0, 0.5);
      --menu-bg: #282a2c;
    }

    html.light-mode {
      --bg: #ffffff;
      --surface: #f0f4f9;
      --surface-elevated: #e1e3e1;
      --text-main: #1f1f1f;
      --text-muted: #444746;
      --user-bubble: #f0f4f9;
      --border: #e3e3e3;
      --input-bg: #f0f4f9;
      --accent: #0b57d0;
      --blue-btn: #0b57d0;
      --math-bg: #edf3fc;
      --math-border: rgba(11, 87, 208, 0.3);
      --dock-shadow: rgba(0, 0, 0, 0.08);
      --menu-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.2s ease, color 0.2s ease;
      user-select: text;
    }

    /* Minimal Gemini Top Bar */
    .gemini-topbar {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      flex-shrink: 0;
      z-index: 50;
      border-bottom: 1px solid var(--border);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-back-link {
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      padding: 4px;
    }

    .brand-pill {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sparkle-svg { width: 22px; height: 22px; }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-top-util {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 18px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* Chat Viewport Area */
    .chat-scroll-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 14px 210px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
    }

    /* Welcome / Hero Guide */
    .gemini-welcome {
      margin-top: 20px;
    }

    .gemini-welcome h1 {
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #4285f4, #9b72cb, #d96570);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gemini-welcome p {
      font-size: 1.02rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .chips-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chip-item {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 14px 16px;
      border-radius: 16px;
      font-size: 0.92rem;
      color: var(--text-main);
      cursor: pointer;
      line-height: 1.4;
    }
    .chip-item:hover { background: var(--surface-elevated); }

    /* Messages */
    .msg-user-row {
      display: flex;
      justify-content: flex-end;
      width: 100%;
      position: relative;
    }

    .msg-user-bubble {
      background: var(--user-bubble);
      color: var(--text-main);
      padding: 12px 18px;
      border-radius: 22px;
      border-bottom-right-radius: 4px;
      max-width: 85%;
      font-size: 0.98rem;
      line-height: 1.5;
      word-break: break-word;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.2s;
    }
    .msg-user-bubble:active {
      opacity: 0.85;
    }

    .msg-ai-row {
      display: flex;
      gap: 12px;
      width: 100%;
      align-items: flex-start;
    }

    .ai-sparkle-box {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      margin-top: 3px;
    }

    .ai-render-content {
      flex: 1;
      min-width: 0;
      font-size: 1.02rem;
      line-height: 1.8;
      color: var(--text-main);
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .ai-render-content h1, .ai-render-content h2, .ai-render-content h3 {
      font-size: 1.15rem;
      font-weight: 700;
      margin: 16px 0 8px;
      color: var(--text-main);
    }

    .ai-render-content p {
      margin-bottom: 12px;
    }

    .ai-render-content ul, .ai-render-content ol {
      margin-left: 20px;
      margin-bottom: 12px;
      padding-left: 2px;
    }

    .ai-render-content li {
      margin-bottom: 12px;
      min-width: 0;
    }

    /* KaTeX Horizontal Scrollable Cards */
    .katex-display {
      display: block !important;
      margin: 8px 0 12px !important;
      padding: 12px 16px !important;
      background: var(--math-bg) !important;
      border: 1px solid var(--math-border) !important;
      border-left: 4px solid var(--blue-btn) !important;
      border-radius: 12px !important;
      overflow-x: auto !important;
      overflow-y: hidden !important;
      -webkit-overflow-scrolling: touch !important;
      scrollbar-width: thin;
      text-align: left !important;
    }

    .katex-display::-webkit-scrollbar {
      height: 4px;
    }
    .katex-display::-webkit-scrollbar-thumb {
      background: var(--blue-btn);
      border-radius: 4px;
    }

    .katex {
      font-size: 1.08em !important;
      color: var(--accent) !important;
    }

    .typewriter-cursor {
      display: inline-block;
      width: 4px;
      height: 16px;
      background: var(--blue-btn);
      margin-left: 4px;
      vertical-align: middle;
      animation: blinkCursor 0.8s infinite;
    }
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Clean Tools Under AI Reply (Only Copy & Voice) */
    .ai-bottom-tools {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 12px;
      padding-top: 4px;
    }

    .btn-tool-icon {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 5px 8px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 8px;
      transition: all 0.15s;
    }
    .btn-tool-icon:hover {
      color: var(--text-main);
      background: var(--surface);
    }

    /* Long-Press Popup Menu */
    .msg-popup-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(2px);
      z-index: 200;
    }
    .msg-popup-overlay.active {
      display: block;
    }

    .msg-context-menu {
      position: absolute;
      background: var(--menu-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      min-width: 190px;
      z-index: 210;
      animation: popIn 0.15s cubic-bezier(0, 0, 0.2, 1);
    }
    @keyframes popIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .context-timestamp {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-main);
      padding: 4px 6px 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 6px;
    }

    .context-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 8px;
      color: var(--text-main);
      font-size: 0.92rem;
      font-weight: 500;
      cursor: pointer;
      border-radius: 10px;
      transition: background 0.15s;
    }
    .context-item:hover {
      background: var(--surface-elevated);
    }
    .context-item svg {
      width: 18px;
      height: 18px;
      color: var(--text-muted);
    }

    /* Bottom Dock Wrapper */
    .gemini-bottom-dock-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: linear-gradient(to top, var(--bg) 80%, transparent);
      padding: 10px 14px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 100;
    }

    /* In-place Editing Indicator */
    .edit-mode-indicator {
      display: none;
      max-width: 760px;
      width: 100%;
      background: var(--surface-elevated);
      border: 1px solid var(--blue-btn);
      border-bottom: none;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      padding: 6px 16px;
      font-size: 0.8rem;
      color: var(--accent);
      justify-content: space-between;
      align-items: center;
    }
    .edit-mode-indicator.active {
      display: flex;
    }
    .btn-cancel-edit {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9rem;
      padding: 2px 6px;
    }
    .btn-cancel-edit:hover { color: #ef4444; }

    .gemini-bottom-card {
      width: 100%;
      max-width: 760px;
      min-height: 54px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 6px 8px 6px 18px;
      box-shadow: 0 4px 24px var(--dock-shadow);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
    }
    .gemini-bottom-card.editing {
      border-top-left-radius: 0;
      border-top-right-radius: 0;
      border-color: var(--blue-btn);
    }
    .gemini-bottom-card:focus-within {
      border-color: var(--blue-btn);
    }

    .dock-input-field {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 1rem;
      font-family: inherit;
      color: var(--text-main);
      padding: 8px 0;
    }
    .dock-input-field::placeholder { color: var(--text-muted); }

    /* Voice waves */
    .gemini-voice-wave-container {
      display: none;
      flex: 1;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 38px;
    }
    .gemini-voice-wave-container.active {
      display: flex;
    }

    .g-wave-bar {
      width: 3.5px;
      height: 8px;
      background: linear-gradient(180deg, #4285f4, #9b72cb);
      border-radius: 4px;
      animation: geminiWave 1s ease-in-out infinite alternate;
    }
    .g-wave-bar:nth-child(1) { animation-delay: 0.1s; height: 10px; }
    .g-wave-bar:nth-child(2) { animation-delay: 0.3s; height: 18px; }
    .g-wave-bar:nth-child(3) { animation-delay: 0.5s; height: 26px; }
    .g-wave-bar:nth-child(4) { animation-delay: 0.2s; height: 20px; }
    .g-wave-bar:nth-child(5) { animation-delay: 0.4s; height: 28px; }
    .g-wave-bar:nth-child(6) { animation-delay: 0.15s; height: 16px; }
    .g-wave-bar:nth-child(7) { animation-delay: 0.35s; height: 22px; }
    .g-wave-bar:nth-child(8) { animation-delay: 0.25s; height: 12px; }

    @keyframes geminiWave {
      0% { height: 6px; transform: scaleY(0.6); }
      100% { height: 28px; transform: scaleY(1.3); }
    }

    .btn-dock-icon {
      background: transparent;
      border: none;
      color: var(--text-muted);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-dock-icon:hover { color: var(--text-main); }
    
    .btn-stop-voice {
      display: none;
      background: rgba(234, 67, 53, 0.15);
      border: 1px solid #ea4335;
      color: #ea4335;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-stop-voice.active {
      display: flex;
    }

    .btn-dock-send {
      background: var(--blue-btn);
      border: none;
      color: #ffffff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(26, 115, 232, 0.4);
    }
    .btn-dock-send svg { width: 18px; height: 18px; }

    /* Loader */
    .loader-dots { display: inline-flex; gap: 5px; padding: 6px 0; }
    .dot {
      width: 7px; height: 7px; border-radius: 50%; background: #4285f4;
      animation: bounce 1.2s infinite ease-in-out both;
    }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0.4); opacity: 0.3; } 40% { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header class="gemini-topbar">
    <div class="topbar-left">
      <a href="index.html" class="btn-back-link" title="होम">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>
      <div class="brand-pill">
        <svg class="sparkle-svg" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" fill="url(#spGrad)"/>
          <defs>
            <linearGradient id="spGrad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
              <stop stop-color="#4285f4"/>
              <stop offset="0.5" stop-color="#9b72cb"/>
              <stop offset="1" stop-color="#d96570"/>
            </linearGradient>
          </defs>
        </svg>
        <span>Nischay AI</span>
      </div>
    </div>
    <div class="topbar-right">
      <button class="btn-top-util" id="voiceToggleBtn" onclick="toggleVoiceOutput()">
        <span id="voiceIcon">🔊</span> <span id="voiceStatus">आवाज़</span>
      </button>
      <button class="btn-top-util" id="themeBtn" onclick="toggleTheme()">☀️ लाइट</button>
      <button class="btn-top-util" onclick="confirmClearChat()">🗑️</button>
    </div>
  </header>

  <!-- Viewport -->
  <main class="chat-scroll-area" id="chatArea">
    
    <div class="gemini-welcome" id="welcomeBox">
      <h1 id="userGreetingHeading">नमस्ते!</h1>
      <p>आज आप क्या समझना या हल करना चाहते हैं?</p>

      <div class="chips-col">
        <div class="chip-item" onclick="askQuick('(A-B)^2 का सूत्र चरणबद्ध तरीके से सिद्ध कीजिए।')">
          📐 (A-B)² सूत्र चरणबद्ध तरीके से सिद्ध करें
        </div>
        <div class="chip-item" onclick="askQuick('गोलीय लेंस के लिए लेंस सूत्र 1/f = 1/v - 1/u का निगमन कीजिए।')">
          🔭 लेंस सूत्र का निगमन (5 मार्क्स)
        </div>
        <div class="chip-item" onclick="askQuick('त्रिकोणमिति के सभी महत्वपूर्ण सूत्र बताइए।')">
          📊 त्रिकोणमिति के सभी सूत्र
        </div>
      </div>
    </div>

    <div id="chatFeed" style="display:flex; flex-direction:column; gap:24px;"></div>

  </main>

  <!-- Long Press Overlay & Context Menu -->
  <div class="msg-popup-overlay" id="popupOverlay" onclick="closeContextMenu()">
    <div class="msg-context-menu" id="contextMenu" onclick="event.stopPropagation()">
      <div class="context-timestamp" id="menuTimestamp">Today, 11:11 pm</div>
      
      <div class="context-item" onclick="menuActionCopy()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <span>Copy</span>
      </div>

      <div class="context-item" onclick="menuActionSelect()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="9" x2="15" y2="9"></line>
          <line x1="9" y1="13" x2="15" y2="13"></line>
        </svg>
        <span>Select text</span>
      </div>

      <div class="context-item" onclick="menuActionEdit()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
        <span>Edit message</span>
      </div>
    </div>
  </div>

  <!-- Bottom Floating Command Bar -->
  <div class="gemini-bottom-dock-wrapper">
    <!-- Edit Indicator Bar -->
    <div class="edit-mode-indicator" id="editIndicator">
      <span>✏️ संदेश संपादित कर रहे हैं (In-place edit)...</span>
      <button class="btn-cancel-edit" onclick="cancelEditMode()" title="रद्द करें">✕</button>
    </div>

    <div class="gemini-bottom-card" id="bottomDockCard">
      <!-- Live Waves -->
      <div class="gemini-voice-wave-container" id="voiceWavesContainer">
        <div class="g-wave-bar"></div>
        <div class="g-wave-bar"></div>
        <div class="g-wave-bar"></div>
        <div class="g-wave-bar"></div>
        <div class="g-wave-bar"></div>
        <div class="g-wave-bar"></div>
        <div class="g-wave-bar"></div>
        <div class="g-wave-bar"></div>
      </div>

      <!-- Input Field -->
      <input 
        type="text" 
        id="userInput" 
        class="dock-input-field" 
        placeholder="Reply to NischayDesk AI..." 
        onkeypress="if(event.key==='Enter') sendUserQuery()"
        autocomplete="off"
      />

      <!-- Stop Recording Button -->
      <button class="btn-stop-voice" id="stopVoiceBtn" onclick="stopVoiceInput()" title="रोकें">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <rect x="5" y="5" width="14" height="14" rx="2"></rect>
        </svg>
      </button>

      <!-- Mic Button -->
      <button class="btn-dock-icon" id="micBtn" onclick="toggleVoiceInput()" title="माइक">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>

      <!-- Send Button -->
      <button class="btn-dock-send" id="sendBtn" onclick="sendUserQuery()" title="भेजें">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <script>
    // 1. Dynamic User Greeting (Strict Logic)
    (function loadUser() {
      const stored = localStorage.getItem('nischay_user_name') || 
                     localStorage.getItem('userName') || 
                     localStorage.getItem('user_display_name') || "";
      const head = document.getElementById('userGreetingHeading');
      if (stored && stored.trim()) {
        const first = stored.trim().split(' ')[0];
        head.innerHTML = `नमस्ते, <span>${escapeHtml(first)}</span>!`;
      } else {
        head.innerHTML = `नमस्ते!`;
      }
    })();

    // 2. Theme Engine
    function syncTheme() {
      const isLight = localStorage.getItem('nischay_theme') === 'light';
      document.documentElement.classList.toggle('light-mode', isLight);
      document.getElementById('themeBtn').innerText = isLight ? '🌙 डार्क' : '☀️ लाइट';
    }

    function toggleTheme() {
      const willLight = !document.documentElement.classList.contains('light-mode');
      localStorage.setItem('nischay_theme', willLight ? 'light' : 'dark');
      syncTheme();
    }
    syncTheme();

    // 3. Natural Speech Engine
    let isVoiceActive = true;
    let naturalHindiVoice = null;

    function initVoices() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      naturalHindiVoice = 
        voices.find(v => v.lang === 'hi-IN' && (v.name.includes('Google') || v.name.includes('Neural') || v.name.includes('Natural'))) ||
        voices.find(v => v.lang === 'hi-IN') ||
        voices[0];
    }
    initVoices();
    if (window.speechSynthesis && window.speechSynthesis.onvoiceschanged !== undefined) {
      window.speechSynthesis.onvoiceschanged = initVoices;
    }

    function toggleVoiceOutput() {
      isVoiceActive = !isVoiceActive;
      const icon = document.getElementById('voiceIcon');
      const status = document.getElementById('voiceStatus');
      if (isVoiceActive) {
        icon.innerText = "🔊";
        status.innerText = "आवाज़";
      } else {
        icon.innerText = "🔇";
        status.innerText = "म्यूट";
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }
    }

    function speakText(txt) {
      if (!isVoiceActive || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const clean = txt
        .replace(/\$\$(.*?)\$\$/gs, ' ')
        .replace(/\$(.*?)\$/g, ' ')
        .replace(/\\\[(.*?)\\\]/gs, ' ')
        .replace(/\\times/g, ' गुणा ')
        .replace(/[#*`_~\[\]\\]/g, '')
        .replace(/\n+/g, '। ')
        .trim();

      if (!clean) return;
      const utt = new SpeechSynthesisUtterance(clean);
      if (naturalHindiVoice) utt.voice = naturalHindiVoice;
      utt.lang = 'hi-IN';
      utt.rate = 0.98;
      utt.pitch = 1.02;
      window.speechSynthesis.speak(utt);
    }

    // 4. API & Strict Context Setup
    const API_TOKEN = "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";
    let isBusy = false;

    const SYSTEM_PROMPT = {
      role: "system",
      content: `You are NischayDesk AI, a professional academic AI tutor for students (especially Bihar Board BSEB Matric & Intermediate).

CRITICAL RESPONSE RULES:
1. DIRECT ANSWERING: Jump directly into the answer. Do NOT add unnecessary intro greetings, do NOT repeat your name, and do NOT mention who created you in regular study questions.
2. CREATOR CONFIDENTIALITY: Mention "Prince Kumar" ONLY AND ONLY IF the user explicitly asks questions like "who made you?", "who created you?", or "developer kaun hai?". Otherwise, NEVER mention Prince Kumar.
3. NISCHAYDESK PORTAL CONTEXT: If asked about the website/portal, explain that NischayDesk is a dedicated educational platform for Bihar Board students offering chapter-wise notes, test series, question banks, formulas, and 24/7 AI doubt support.
4. MATHEMATICAL FORMULAS: Put every mathematical formula, derivation, or equation in clean display math blocks:
$$ (A - B)^2 = A^2 - 2AB + B^2 $$
Never use raw square brackets like "[ (A-B)... ]". Always wrap in "$$".
5. TONE: Mature, supportive, direct, and respectful Hindi.`
    };

    // Chat Memory with LocalStorage
    let chatMemory = [];
    try {
      const saved = localStorage.getItem('nischay_chat_history');
      if (saved) {
        chatMemory = JSON.parse(saved);
      }
    } catch(e) {}

    if (!chatMemory || chatMemory.length === 0 || chatMemory[0].role !== 'system') {
      chatMemory = [SYSTEM_PROMPT];
    }

    function askQuick(q) {
      document.getElementById('userInput').value = q;
      sendUserQuery();
    }

    // Formatter
    function normalizeFormulas(raw) {
      if (!raw) return "";
      let clean = raw.replace(/(?:^|\n)\s*\[\s*([\s\S]*?)\s*\](?:\s*(?:\n|$))/g, function(match, inner) {
        if (inner.includes('\\times') || inner.includes('^') || inner.includes('=') || inner.includes('-') || inner.includes('+')) {
          return '\n\n$$ ' + inner.trim() + ' $$\n\n';
        }
        return match;
      });
      clean = clean.replace(/\\\[([\s\S]*?)\\\]/g, '\n\n$$ $1 $$\n\n');
      return clean;
    }

    function renderKaTeXSafe(elem) {
      if (window.renderMathInElement) {
        window.renderMathInElement(elem, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }

    function getFormattedTime() {
      const now = new Date();
      let hours = now.getHours();
      const mins = now.getMinutes().toString().padStart(2, '0');
      const ampm = hours >= 12 ? 'pm' : 'am';
      hours = hours % 12 || 12;
      return `Today, ${hours}:${mins} ${ampm}`;
    }

    // Chat UI Renderer
    function renderFullChatFeed() {
      const feed = document.getElementById('chatFeed');
      const welcome = document.getElementById('welcomeBox');
      feed.innerHTML = '';
      
      const userMsgs = chatMemory.filter(m => m.role === 'user' || m.role === 'assistant');
      if (userMsgs.length > 0 && welcome) {
        welcome.style.display = 'none';
      } else if (welcome) {
        welcome.style.display = 'block';
      }

      userMsgs.forEach(m => {
        if (m.role === 'user') {
          feed.innerHTML += createUserBubbleHTML(m.content, m.time || getFormattedTime(), m.id);
        } else if (m.role === 'assistant') {
          feed.innerHTML += createAIBubbleHTML(m.content, m.id);
        }
      });

      setTimeout(() => {
        renderKaTeXSafe(feed);
        scrollBottom();
      }, 50);
    }

    function createUserBubbleHTML(content, time, msgId) {
      const idAttr = msgId ? `id="user-msg-${msgId}" data-msg-id="${msgId}"` : '';
      return `
        <div class="msg-user-row" ${idAttr}>
          <div class="msg-user-bubble" 
               data-text="${escapeAttr(content)}" 
               data-time="${escapeAttr(time)}"
               data-id="${msgId || ''}"
               onmousedown="startLongPress(event, this)" 
               onmouseup="cancelLongPress()" 
               onmouseleave="cancelLongPress()"
               ontouchstart="startLongPress(event, this)" 
               ontouchend="cancelLongPress()" 
               ontouchcancel="cancelLongPress()">
            ${escapeHtml(content)}
          </div>
        </div>
      `;
    }

    function createAIBubbleHTML(content, msgId) {
      const normalized = normalizeFormulas(content);
      const safeEscaped = escapeHtml(content.replace(/'/g, "\\'"));
      const idAttr = msgId ? `id="ai-msg-${msgId}"` : '';
      return `
        <div class="msg-ai-row" ${idAttr}>
          <svg class="ai-sparkle-box" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" fill="url(#spGrad2)"/>
            <defs>
              <linearGradient id="spGrad2" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                <stop stop-color="#4285f4"/>
                <stop offset="0.5" stop-color="#9b72cb"/>
                <stop offset="1" stop-color="#d96570"/>
              </linearGradient>
            </defs>
          </svg>
          <div class="ai-render-content">
            <div class="slot-text">${marked.parse(normalized)}</div>
            <div class="ai-bottom-tools">
              <button class="btn-tool-icon" onclick="copyAIText(this)" title="Copy">📋 कॉपी</button>
              <button class="btn-tool-icon" onclick="speakText('${safeEscaped}')" title="Read aloud">🔊 सुनाएँ</button>
            </div>
          </div>
        </div>
      `;
    }

    renderFullChatFeed();

    // 5. Long Press & Context Menu
    let longPressTimer = null;
    let selectedBubble = null;
    let editingMessageId = null;

    function startLongPress(e, elem) {
      selectedBubble = elem;
      longPressTimer = setTimeout(() => {
        openContextMenu(e, elem);
      }, 450);
    }

    function cancelLongPress() {
      if (longPressTimer) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
    }

    function openContextMenu(e, elem) {
      cancelLongPress();
      const overlay = document.getElementById('popupOverlay');
      const menu = document.getElementById('contextMenu');
      const timeBox = document.getElementById('menuTimestamp');

      const msgTime = elem.getAttribute('data-time') || getFormattedTime();
      timeBox.innerText = msgTime;

      const rect = elem.getBoundingClientRect();
      const menuWidth = 190;
      let topPos = rect.bottom + 6;
      let leftPos = rect.right - menuWidth;

      if (leftPos < 10) leftPos = 10;
      if (topPos + 180 > window.innerHeight) {
        topPos = rect.top - 170;
      }

      menu.style.top = `${topPos}px`;
      menu.style.left = `${leftPos}px`;
      overlay.classList.add('active');
    }

    function closeContextMenu() {
      document.getElementById('popupOverlay').classList.remove('active');
    }

    function menuActionCopy() {
      if (!selectedBubble) return;
      const txt = selectedBubble.getAttribute('data-text');
      navigator.clipboard.writeText(txt);
      closeContextMenu();
      alert("कॉपी हो गया! 📋");
    }

    function menuActionSelect() {
      if (!selectedBubble) return;
      closeContextMenu();
      const range = document.createRange();
      range.selectNodeContents(selectedBubble);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    // In-place Edit Action
    function menuActionEdit() {
      if (!selectedBubble) return;
      const txt = selectedBubble.getAttribute('data-text');
      const msgId = selectedBubble.getAttribute('data-id');
      
      editingMessageId = msgId;
      const input = document.getElementById('userInput');
      input.value = txt;
      input.focus();

      // UI में एडिट इंडिकेटर दिखाएँ
      document.getElementById('editIndicator').classList.add('active');
      document.getElementById('bottomDockCard').classList.add('editing');
      closeContextMenu();
    }

    function cancelEditMode() {
      editingMessageId = null;
      document.getElementById('editIndicator').classList.remove('active');
      document.getElementById('bottomDockCard').classList.remove('editing');
      document.getElementById('userInput').value = '';
    }

    function copyAIText(btn) {
      const txt = btn.closest('.ai-render-content').querySelector('.slot-text').innerText;
      navigator.clipboard.writeText(txt);
      alert("उत्तर कॉपी हो गया! 📋");
    }

    // 6. Typewriter Engine
    function startTypewriter(slot, text, onFinish) {
      let index = 0;
      const step = Math.max(4, Math.floor(text.length / 60));
      slot.innerHTML = `<span class="stream-text"></span><span class="typewriter-cursor"></span>`;
      const txtSpan = slot.querySelector('.stream-text');
      const curSpan = slot.querySelector('.typewriter-cursor');

      const normalized = normalizeFormulas(text);

      function tick() {
        if (index < normalized.length) {
          index += step;
          txtSpan.innerHTML = marked.parse(normalized.slice(0, index));
          scrollBottom();
          requestAnimationFrame(tick);
        } else {
          if (curSpan) curSpan.remove();
          txtSpan.innerHTML = marked.parse(normalized);
          renderKaTeXSafe(txtSpan);
          scrollBottom();
          if (onFinish) onFinish();
        }
      }
      tick();
    }

    // 7. Query Sender (Handles New Query & In-place Edit)
    async function sendUserQuery() {
      const input = document.getElementById('userInput');
      const feed = document.getElementById('chatFeed');
      const welcome = document.getElementById('welcomeBox');
      const q = input.value.trim();

      if (!q || isBusy) return;

      if (welcome) welcome.style.display = 'none';

      let activeUserMsgId = editingMessageId;
      const currentTime = getFormattedTime();

      if (editingMessageId) {
        // --- IN-PLACE EDIT MODE ---
        // मेमोरी में से उस संदेश और उसके आगे के सारे संदेश हटा दें (या एडिट करें)
        const targetIdx = chatMemory.findIndex(m => m.id === editingMessageId);
        if (targetIdx !== -1) {
          chatMemory = chatMemory.slice(0, targetIdx);
        }

        // स्क्रीन से भी उस एडिटेड संदेश के बाद के सभी UI बबल्स साफ़ करें
        const targetElem = document.getElementById(`user-msg-${editingMessageId}`);
        if (targetElem) {
          let nextElem = targetElem.nextElementSibling;
          while (nextElem) {
            const toRemove = nextElem;
            nextElem = nextElem.nextElementSibling;
            toRemove.remove();
          }
          // उसी पुराने बबल का टेक्स्ट और टाइम अपडेट कर दें (दूसरा नया नहीं बनेगा!)
          const bubble = targetElem.querySelector('.msg-user-bubble');
          bubble.setAttribute('data-text', q);
          bubble.setAttribute('data-time', currentTime);
          bubble.innerHTML = escapeHtml(q);
        }

        cancelEditMode();
      } else {
        // --- NORMAL NEW MESSAGE MODE ---
        activeUserMsgId = 'msg-' + Date.now();
        feed.innerHTML += createUserBubbleHTML(q, currentTime, activeUserMsgId);
      }

      input.value = '';
      scrollBottom();

      // Push to Memory
      chatMemory.push({ role: "user", content: q, time: currentTime, id: activeUserMsgId });
      if (chatMemory.length > 18) {
        chatMemory = [chatMemory[0], ...chatMemory.slice(-16)];
      }

      isBusy = true;
      const loadId = 'load-' + Date.now();
      const aiMsgId = 'ai-' + Date.now();

      feed.innerHTML += `
        <div class="msg-ai-row" id="${loadId}">
          <svg class="ai-sparkle-box" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" fill="url(#spGrad2)"/>
            <defs>
              <linearGradient id="spGrad2" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                <stop stop-color="#4285f4"/>
                <stop offset="0.5" stop-color="#9b72cb"/>
                <stop offset="1" stop-color="#d96570"/>
              </linearGradient>
            </defs>
          </svg>
          <div class="ai-render-content">
            <div class="loader-dots">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </div>
        </div>
      `;
      scrollBottom();

      try {
        const apiMessages = chatMemory.map(m => ({ role: m.role, content: m.content }));

        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + API_TOKEN,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "openai/gpt-oss-20b",
            messages: apiMessages,
            temperature: 0.3,
            max_tokens: 2048
          })
        });

        const data = await res.json();
        const aiWrapper = document.getElementById(loadId);

        if (data.choices && data.choices[0]?.message?.content) {
          const ans = data.choices[0].message.content;
          chatMemory.push({ role: "assistant", content: ans, id: aiMsgId });
          try {
            localStorage.setItem('nischay_chat_history', JSON.stringify(chatMemory));
          } catch(e) {}

          const safeEscaped = escapeHtml(ans.replace(/'/g, "\\'"));
          aiWrapper.setAttribute('id', `ai-msg-${aiMsgId}`);
          aiWrapper.querySelector('.ai-render-content').innerHTML = `
            <div class="slot-text"></div>
            <div class="ai-bottom-tools" style="display:none;">
              <button class="btn-tool-icon" onclick="copyAIText(this)" title="Copy">📋 कॉपी</button>
              <button class="btn-tool-icon" onclick="speakText('${safeEscaped}')" title="Read aloud">🔊 सुनाएँ</button>
            </div>
          `;

          const slot = aiWrapper.querySelector('.slot-text');
          const tools = aiWrapper.querySelector('.ai-bottom-tools');

          startTypewriter(slot, ans, () => {
            tools.style.display = 'flex';
            isBusy = false;
            if (isVoiceActive) speakText(ans);
          });

        } else {
          aiWrapper.querySelector('.ai-render-content').innerHTML = `<span style="color:#ea4335;">⚠️ उत्तर प्राप्त नहीं हुआ।</span>`;
          isBusy = false;
        }

      } catch (e) {
        document.getElementById(loadId).querySelector('.ai-render-content').innerHTML = `<span style="color:#ea4335;">⚠️ नेटवर्क त्रुटि!</span>`;
        isBusy = false;
      }

      scrollBottom();
    }

    // 8. Gemini Voice Waves Engine
    let recognition;
    let isRec = false;

    function toggleVoiceInput() {
      const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Speech) {
        alert("कृपया Google Chrome का उपयोग करें।");
        return;
      }

      if (isRec) {
        stopVoiceInput();
        return;
      }

      recognition = new Speech();
      recognition.lang = 'hi-IN';

      const input = document.getElementById('userInput');
      const waves = document.getElementById('voiceWavesContainer');
      const micBtn = document.getElementById('micBtn');
      const stopBtn = document.getElementById('stopVoiceBtn');

      recognition.onstart = () => {
        isRec = true;
        input.style.display = 'none';
        micBtn.style.display = 'none';
        waves.classList.add('active');
        stopBtn.classList.add('active');
      };

      recognition.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        input.value = transcript;
        stopVoiceInput();
        sendUserQuery();
      };

      recognition.onerror = recognition.onend = () => {
        stopVoiceInput();
      };

      recognition.start();
    }

    function stopVoiceInput() {
      if (recognition && isRec) {
        recognition.stop();
      }
      isRec = false;
      document.getElementById('userInput').style.display = 'block';
      document.getElementById('micBtn').style.display = 'flex';
      document.getElementById('voiceWavesContainer').classList.remove('active');
      document.getElementById('stopVoiceBtn').classList.remove('active');
    }

    function confirmClearChat() {
      if (confirm("क्या आप पूरी चैट और पुरानी याददाश्त मिटाना चाहते हैं?")) {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        document.getElementById('chatFeed').innerHTML = '';
        document.getElementById('welcomeBox').style.display = 'block';
        chatMemory = [SYSTEM_PROMPT];
        localStorage.removeItem('nischay_chat_history');
        cancelEditMode();
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function escapeAttr(str) {
      return str.replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function scrollBottom() {
      const vp = document.getElementById('chatArea');
      vp.scrollTop = vp.scrollHeight;
    }
  </script>
</body>
