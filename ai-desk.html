<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NischayDesk AI Studio Pro | Next-Gen AI Doubt Engine</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- MathJax Configuration (Responsive Mobile Wrapper) -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      },
      chtml: {
        displayAlign: 'left'
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    :root {
      --bg: #030712;
      --surface: #0b1329;
      --surface-elevated: #111c38;
      --card-bg: #0f172a;
      --border: rgba(56, 189, 248, 0.2);
      --accent: #38bdf8;
      --primary: #0284c7;
      --gradient: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --code-block: #020617;
    }

    html.light-mode {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-elevated: #e2e8f0;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --accent: #0284c7;
      --primary: #0284c7;
      --text-main: #0f172a;
      --text-muted: #475569;
      --code-block: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.2s ease, color 0.2s ease;
    }

    /* Top Bar */
    .app-header {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 50;
    }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-nav-back {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .brand-tag-pill {
      font-size: 0.72rem;
      font-weight: 800;
      background: var(--gradient);
      color: #fff;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .btn-top-action {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Chat Viewport Area */
    .chat-scroll-viewport {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 12px 160px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
    }

    /* Hero Guide Card */
    .hero-guide-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px 14px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .hero-guide-card h2 {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 4px;
    }
    .hero-guide-card h2 span {
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-guide-card p {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      line-height: 1.45;
    }

    .mode-pills-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
      justify-content: flex-start;
    }
    .mode-pills-row::-webkit-scrollbar { display: none; }
    @media (min-width: 600px) { .mode-pills-row { justify-content: center; } }

    .mode-pill {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 14px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .mode-pill.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--accent);
    }

    .quick-chips-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
      text-align: left;
    }

    .quick-chip-box {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--accent);
      line-height: 1.35;
      transition: transform 0.15s ease;
    }
    .quick-chip-box:hover { transform: translateY(-2px); border-color: var(--accent); }

    /* Bubbles */
    .user-bubble {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      padding: 12px 16px;
      border-radius: 16px;
      border-bottom-right-radius: 4px;
      align-self: flex-end;
      max-width: 86%;
      font-size: 0.92rem;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
      word-break: break-word;
    }

    .ai-bubble {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      padding: 16px;
      color: var(--text-main);
      font-size: 0.94rem;
      line-height: 1.65;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      word-wrap: break-word;
    }

    .ai-badge-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 6px;
      width: fit-content;
      margin-bottom: 10px;
    }

    .stream-slot {
      max-width: 100%;
      overflow-x: hidden;
    }

    .ai-bubble h1, .ai-bubble h2, .ai-bubble h3 {
      font-size: 1.05rem;
      margin: 12px 0 6px;
      color: var(--text-main);
    }
    .ai-bubble p { margin-bottom: 8px; }
    .ai-bubble ul, .ai-bubble ol { margin-left: 18px; margin-bottom: 8px; }
    .ai-bubble li { margin-bottom: 3px; }

    /* STRICT MATHJAX OVERFLOW HANDLING - कभी बाहर नहीं कटेगा */
    mjx-container {
      max-width: 100% !important;
      overflow-x: auto !important;
      overflow-y: hidden !important;
      padding: 6px 2px !important;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }

    mjx-container[jax="CHTML"][display="true"] {
      margin: 10px 0 !important;
      padding: 10px 12px !important;
      background: var(--code-block) !important;
      border: 1px solid var(--border) !important;
      border-radius: 8px !important;
      display: block !important;
    }

    .bubble-actions-row {
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-msg-action {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-msg-action:hover { color: var(--accent); border-color: var(--accent); }

    .typewriter-cursor {
      display: inline-block;
      width: 6px;
      height: 15px;
      background: var(--accent);
      margin-left: 3px;
      vertical-align: middle;
      animation: blink 0.7s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    .dots-loader-box {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 2px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.3s infinite ease-in-out both;
    }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    .dot:nth-child(3) { animation-delay: 0s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.35); opacity: 0.3; }
      40% { transform: scale(1.1); opacity: 1; }
    }

    /* Fixed Command Dock */
    .bottom-command-dock {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 20px);
      max-width: 820px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 34px;
      padding: 6px 8px 6px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      z-index: 100;
    }

    .dock-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 8px 2px;
      font-size: 0.94rem;
      font-family: inherit;
      color: var(--text-main);
    }
    .dock-input::placeholder { color: var(--text-muted); }

    .voice-waves {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex: 1;
      height: 36px;
    }
    .voice-waves.active { display: flex; }

    .v-bar {
      width: 4px;
      height: 8px;
      background: var(--accent);
      border-radius: 4px;
      animation: waveDance 1s ease-in-out infinite alternate;
    }
    .v-bar:nth-child(1) { animation-delay: 0.1s; }
    .v-bar:nth-child(2) { animation-delay: 0.3s; }
    .v-bar:nth-child(3) { animation-delay: 0.5s; }
    .v-bar:nth-child(4) { animation-delay: 0.2s; }
    .v-bar:nth-child(5) { animation-delay: 0.4s; }

    @keyframes waveDance {
      0% { height: 4px; }
      100% { height: 22px; }
    }

    .btn-mic-round {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid var(--border);
      color: var(--accent);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-mic-round.recording {
      background: #ef4444;
      color: #fff;
      border-color: #ef4444;
    }

    .btn-send-arrow {
      background: var(--gradient);
      color: #fff;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
    }
    .btn-send-arrow svg { width: 20px; height: 20px; }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="app-header">
    <div class="header-left">
      <a href="index.html" class="btn-nav-back">⬅ डैशबोर्ड</a>
      <span class="brand-tag-pill">AI V3.7 PRO</span>
    </div>
    <div class="header-right">
      <button class="btn-top-action" onclick="toggleTheme()">
        <span id="themeIcon">🌙</span> <span id="themeText">डार्क</span>
      </button>
      <button class="btn-top-action" onclick="confirmClearChat()">🗑️ साफ़ करें</button>
    </div>
  </header>

  <!-- Viewport -->
  <main class="chat-scroll-viewport" id="chatViewport">
    
    <!-- Hero Box -->
    <div class="hero-guide-card" id="heroGuideCard">
      <h2 id="greetingTitle">स्मार्ट <span>AI डाउट सॉल्वर</span></h2>
      <p>बातचीत करें, सवाल पूछें या थ्योरी और डेरिवेशन समझें। यह आपके हर सवाल का सही संदर्भ समझकर जवाब देगा।</p>

      <div class="mode-pills-row">
        <button class="mode-pill active" onclick="setMode('chat', this)">💬 सामान्य बातचीत</button>
        <button class="mode-pill" onclick="setMode('derivation', this)">📐 स्टेप-बाय-स्टेप हल</button>
        <button class="mode-pill" onclick="setMode('board', this)">📝 5-अंक बोर्ड उत्तर</button>
        <button class="mode-pill" onclick="setMode('tricks', this)">⚡ शॉर्ट ट्रिक्स & फॉर्मूला</button>
      </div>

      <div class="quick-chips-grid">
        <div class="quick-chip-box" onclick="askQuick('(A+B)^2 का सूत्र चरणबद्ध तरीके से सिद्ध कीजिए।')">
          📐 (A+B)^2 सूत्र सिद्ध करें
        </div>
        <div class="quick-chip-box" onclick="askQuick('गोलीय लेंस के लिए लेंस सूत्र 1/f = 1/v - 1/u का निगमन कीजिए।')">
          🔭 लेंस सूत्र निगमन (5 मार्क्स)
        </div>
        <div class="quick-chip-box" onclick="askQuick('द्विघात समीकरण ax^2 + bx + c = 0 का श्रीधराचार्य सूत्र सिद्ध करें।')">
          📊 श्रीधराचार्य सूत्र सिद्ध करें
        </div>
        <div class="quick-chip-box" onclick="askQuick('प्रकाश का परावर्तन और अपवर्तन क्या है? इनके नियम बताइए।')">
          💡 प्रकाश के नियम
        </div>
      </div>
    </div>

    <!-- Feed -->
    <div id="chatFeed" style="display:flex; flex-direction:column; gap:16px;"></div>

  </main>

  <!-- Bottom Command Dock -->
  <footer class="bottom-command-dock">
    
    <div class="voice-waves" id="voiceWaves">
      <div class="v-bar"></div>
      <div class="v-bar"></div>
      <div class="v-bar"></div>
      <div class="v-bar"></div>
      <div class="v-bar"></div>
    </div>

    <input 
      type="text" 
      id="queryInput" 
      class="dock-input" 
      placeholder="कुछ भी पूछें या बात करें (उदा: बोलो भाई, थेल्स प्रमेय...)" 
      onkeypress="if(event.key==='Enter') executeSend()"
    />

    <button class="btn-mic-round" id="micButton" onclick="handleVoiceRecord()" title="आवाज़ से पूछें">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </button>

    <button class="btn-send-arrow" onclick="executeSend()" title="भेजें">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5"></line>
        <polyline points="5 12 12 5 19 12"></polyline>
      </svg>
    </button>
  </footer>

  <script>
    // Theme Engine
    function syncTheme() {
      const isLight = localStorage.getItem('nischay_theme') === 'light';
      document.documentElement.classList.toggle('light-mode', isLight);
      document.getElementById('themeIcon').innerText = isLight ? '☀️' : '🌙';
      document.getElementById('themeText').innerText = isLight ? 'लाइट' : 'डार्क';
    }

    function toggleTheme() {
      const willBeLight = !document.documentElement.classList.contains('light-mode');
      localStorage.setItem('nischay_theme', willBeLight ? 'light' : 'dark');
      syncTheme();
    }
    syncTheme();

    // User Personalization
    (function setUserGreeting() {
      const name = localStorage.getItem('nischay_user_name') || "";
      const cls = localStorage.getItem('nischay_student_class') || "11";
      if (name) {
        document.getElementById('greetingTitle').innerHTML = `नमस्ते, <span>${name.split(' ')[0]}</span>! (Class ${cls}th)`;
      }
    })();

    // Groq Cloud Setup with Layout Guidelines
    const API_TOKEN = "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";
    let isBusy = false;
    let activePromptMode = "You are NischayDesk AI, created by Prince Kumar. Rule 1: Recognize user context. If the user says casual greetings ('bolo', 'hi', 'bhai'), respond warmly in natural Hindi/Hinglish. Rule 2: NEVER put Hindi words inside LaTeX math brackets (e.g. do not write '$x \\text{ का मान}$'). Write Hindi text as normal paragraphs, and put formulas in separate, short display blocks ($$...$$). Rule 3: Break long equations into multiple smaller lines so they fit comfortably on mobile screens.";

    function setMode(mode, btn) {
      document.querySelectorAll('.mode-pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');

      if (mode === 'chat') {
        activePromptMode = "You are NischayDesk AI. Answer friendly in natural Hindi/Hinglish for casual talk, and give clear academic advice when asked.";
      } else if (mode === 'derivation') {
        activePromptMode = "You are NischayDesk AI. Provide step-by-step mathematical proofs with short equation lines. Put all math strictly in clean display math ($$...$$) and never mix Hindi inside math tags.";
      } else if (mode === 'board') {
        activePromptMode = "You are NischayDesk AI. Give 5-mark board exam answers with definition, clear points, and conclusion in clean Hindi.";
      } else if (mode === 'tricks') {
        activePromptMode = "You are NischayDesk AI. Provide rapid memory tricks, shortcut formulas, and revision points.";
      }
    }

    function askQuick(text) {
      document.getElementById('queryInput').value = text;
      executeSend();
    }

    function cleanMathFormatting(raw) {
      if (!raw) return "";
      return raw
        .replace(/\\\[([\s\S]*?)\\\]/g, '$$$1$$')
        .replace(/\\\(([\s\S]*?)\\\)/g, '$$$1$$');
    }

    // Typewriter Engine
    function startTypewriter(elem, fullContent, onFinished) {
      let cursor = 0;
      const totalLen = fullContent.length;
      const jump = Math.max(3, Math.floor(totalLen / 100));

      elem.innerHTML = `<span class="type-stream"></span><span class="typewriter-cursor"></span>`;
      const streamSpan = elem.querySelector('.type-stream');
      const cursorSpan = elem.querySelector('.typewriter-cursor');

      function typeTick() {
        if (cursor < totalLen) {
          cursor += jump;
          streamSpan.innerHTML = marked.parse(cleanMathFormatting(fullContent.slice(0, cursor)));
          scrollBottom();
          requestAnimationFrame(typeTick);
        } else {
          if (cursorSpan) cursorSpan.remove();
          streamSpan.innerHTML = marked.parse(cleanMathFormatting(fullContent));
          
          if (window.MathJax && window.MathJax.typesetPromise) {
            window.MathJax.typesetPromise([elem])
              .then(() => { scrollBottom(); if (onFinished) onFinished(); })
              .catch(() => { if (onFinished) onFinished(); });
          } else {
            scrollBottom();
            if (onFinished) onFinished();
          }
        }
      }
      typeTick();
    }

    // Query Dispatcher
    async function executeSend() {
      const input = document.getElementById('queryInput');
      const feed = document.getElementById('chatFeed');
      const hero = document.getElementById('heroGuideCard');
      const query = input.value.trim();

      if (!query || isBusy) return;

      hero.style.display = 'none';
      feed.innerHTML += `<div class="user-bubble">${escapeHtml(query)}</div>`;
      input.value = '';
      scrollBottom();

      isBusy = true;
      const loadId = 'load-' + Date.now();
      feed.innerHTML += `
        <div class="ai-bubble" id="${loadId}">
          <div class="dots-loader-box">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
      `;
      scrollBottom();

      try {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + API_TOKEN,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "openai/gpt-oss-20b",
            messages: [
              { role: "system", content: activePromptMode },
              { role: "user", content: query }
            ],
            temperature: 0.3,
            max_tokens: 2048
          })
        });

        const data = await res.json();
        const loadBox = document.getElementById(loadId);

        if (data.choices && data.choices[0]?.message?.content) {
          const answerText = data.choices[0].message.content;

          loadBox.innerHTML = `
            <div class="ai-badge-row">NischayDesk Verified</div>
            <div class="stream-slot"></div>
            <div class="bubble-actions-row" style="display:none;">
              <button class="btn-msg-action" onclick="speakText(this)">🔊 सुनाएँ</button>
              <button class="btn-msg-action" onclick="copyText(this)">📋 कॉपी</button>
              <button class="btn-msg-action" onclick="downloadText(this)">📥 सेव</button>
            </div>
          `;

          const slot = loadBox.querySelector('.stream-slot');
          const acts = loadBox.querySelector('.bubble-actions-row');

          startTypewriter(slot, answerText, () => {
            acts.style.display = 'flex';
            isBusy = false;
          });

        } else {
          loadBox.innerHTML = `<span style="color:#ef4444;">⚠️ उत्तर प्राप्त नहीं हुआ। पुनः प्रयास करें।</span>`;
          isBusy = false;
        }

      } catch (e) {
        document.getElementById(loadId).innerHTML = `<span style="color:#ef4444;">⚠️ नेटवर्क एरर! कनेक्शन जांचें।</span>`;
        isBusy = false;
      }

      scrollBottom();
    }

    // Voice Engine
    let recognitionInstance;
    let isRecording = false;

    function handleVoiceRecord() {
      const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Speech) {
        alert("कृपया Google Chrome ब्राउज़र का उपयोग करें।");
        return;
      }

      const input = document.getElementById('queryInput');
      const wave = document.getElementById('voiceWaves');
      const mic = document.getElementById('micButton');

      if (isRecording) {
        recognitionInstance.stop();
        return;
      }

      recognitionInstance = new Speech();
      recognitionInstance.lang = 'hi-IN';

      recognitionInstance.onstart = () => {
        isRecording = true;
        input.style.display = 'none';
        wave.classList.add('active');
        mic.classList.add('recording');
      };

      recognitionInstance.onresult = (e) => {
        input.value = e.results[0][0].transcript;
        executeSend();
      };

      recognitionInstance.onerror = recognitionInstance.onend = () => {
        isRecording = false;
        wave.classList.remove('active');
        input.style.display = 'block';
        mic.classList.remove('recording');
      };

      recognitionInstance.start();
    }

    // Actions
    function speakText(btn) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const txt = btn.closest('.ai-bubble').querySelector('.stream-slot').innerText;
      const utt = new SpeechSynthesisUtterance(txt);
      utt.lang = 'hi-IN';
      window.speechSynthesis.speak(utt);
    }

    function copyText(btn) {
      const txt = btn.closest('.ai-bubble').querySelector('.stream-slot').innerText;
      navigator.clipboard.writeText(txt);
      alert("उत्तर कॉपी हो गया! 📋");
    }

    function downloadText(btn) {
      const txt = btn.closest('.ai-bubble').querySelector('.stream-slot').innerText;
      const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `NischayDesk_AI_${Date.now()}.txt`;
      a.click();
    }

    // Confirmation Popup on Clear
    function confirmClearChat() {
      const answer = confirm("क्या आप वाकई पूरी चैट मिटाना चाहते हैं?");
      if (answer) {
        document.getElementById('chatFeed').innerHTML = '';
        document.getElementById('heroGuideCard').style.display = 'block';
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function scrollBottom() {
      const vp = document.getElementById('chatViewport');
      vp.scrollTop = vp.scrollHeight;
    }
  </script>
</body>
</html>
