<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NischayDesk AI Studio Pro | By Prince Kumar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- MathJax Engine -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    :root {
      --bg: #030712;
      --surface: #0b1329;
      --card-bg: rgba(15, 23, 42, 0.75);
      --border: rgba(56, 189, 248, 0.18);
      --accent: #38bdf8;
      --primary: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: radial-gradient(circle at 50% 0%, #0d1b3e 0%, #030712 100%);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top App Header with Dashboard Back Button */
    .app-header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(3, 7, 18, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }

    .brand-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #fff;
    }

    .btn-back-home {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .brand-title {
      font-size: 0.98rem;
      font-weight: 700;
    }
    .brand-title span { color: var(--accent); }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-circle {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
    }

    /* Viewport with extra bottom padding so input never hides text */
    .viewport {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px 140px;
      display: flex;
      flex-direction: column;
    }

    .gemini-hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 20px;
      max-width: 600px;
      margin: 0 auto;
    }

    .hero-gemini-logo {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #f472b6, #fb923c);
      clip-path: polygon(50% 0%, 63% 37%, 100% 50%, 63% 63%, 50% 100%, 37% 63%, 0% 50%, 37% 37%);
      filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.5));
    }

    .hero-title {
      font-size: 1.6rem;
      font-weight: 800;
      line-height: 1.35;
      color: #fff;
    }

    .hero-cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
      margin-top: 6px;
    }

    .hero-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 14px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .hero-card .icon { font-size: 1.15rem; }
    .hero-card .heading { font-size: 0.82rem; font-weight: 700; color: #fff; }
    .hero-card .sub { font-size: 0.7rem; color: var(--text-muted); }

    .chat-stream {
      display: flex;
      flex-direction: column;
      gap: 22px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }

    .user-entry {
      align-self: flex-end;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff;
      padding: 10px 16px;
      border-radius: 16px;
      border-bottom-right-radius: 4px;
      font-size: 0.92rem;
      max-width: 88%;
      word-break: break-word;
    }

    /* Fully responsive document response container to prevent text clipping */
    .ai-document-response {
      width: 100%;
      color: var(--text-main);
      font-size: 0.93rem;
      line-height: 1.65;
      word-break: break-word;
      overflow-x: hidden;
    }

    /* Live 3-Dots Wave Animation */
    .typing-wave {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 0;
    }

    .wave-dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      animation: dotPulse 1.3s infinite ease-in-out;
    }
    .wave-dot:nth-child(2) { animation-delay: 0.2s; }
    .wave-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
      30% { transform: translateY(-8px); opacity: 1; }
    }

    /* Tables wrapper to allow horizontal scroll only inside table if screen is too small */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      margin: 14px 0;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .ai-document-response table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      background: rgba(11, 19, 41, 0.8);
      white-space: nowrap;
    }

    .ai-document-response th, .ai-document-response td {
      border: 1px solid var(--border);
      padding: 9px 12px;
      text-align: left;
    }

    .ai-document-response th {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      font-weight: 700;
    }

    .katex-display {
      overflow-x: auto;
      overflow-y: hidden;
      padding: 4px 0;
      max-width: 100%;
    }

    /* Response Action Footer (Speak & Copy) */
    .response-footer-actions {
      display: flex;
      gap: 12px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .footer-action-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .footer-action-btn:hover { color: var(--accent); }

    /* Floating Capsule Dock */
    .dock-wrapper {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 20px);
      max-width: 700px;
      z-index: 100;
    }

    .pill-dock {
      background: rgba(11, 19, 41, 0.95);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 40px;
      padding: 6px 8px 6px 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
    }

    .pill-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.92rem;
      font-family: inherit;
      padding: 8px 2px;
    }

    .dock-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
    }

    /* Live Voice Vibration Waves */
    .voice-bars {
      display: none;
      align-items: center;
      gap: 3px;
      height: 18px;
      padding: 0 2px;
    }
    .voice-bars.listening { display: flex; }

    .v-bar {
      width: 3px;
      border-radius: 3px;
      animation: voiceWave 0.8s infinite ease-in-out alternate;
    }
    .v-bar:nth-child(1) { height: 6px; background: #38bdf8; animation-delay: 0.1s; }
    .v-bar:nth-child(2) { height: 16px; background: #818cf8; animation-delay: 0.3s; }
    .v-bar:nth-child(3) { height: 10px; background: #f472b6; animation-delay: 0.2s; }
    .v-bar:nth-child(4) { height: 4px; background: #fb923c; animation-delay: 0.4s; }

    @keyframes voiceWave {
      from { height: 4px; }
      to { height: 20px; }
    }

    .send-pill-btn {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #030712;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- App Header with Back to Dashboard Button -->
  <header class="app-header">
    <div style="display:flex; align-items:center; gap:8px;">
      <a href="index.html" class="btn-back-home">⬅ डैशबोर्ड</a>
      <div class="brand-meta">
        <div class="brand-title">Nischay<span>Desk</span> AI</div>
      </div>
    </div>
    <div class="nav-actions">
      <button class="btn-circle" onclick="startFreshSession()" title="नया चैट">➕</button>
    </div>
  </header>

  <main class="viewport" id="mainViewport">
    <div class="gemini-hero" id="geminiHero">
      <div class="hero-gemini-logo"></div>
      <h2 class="hero-title">नमस्ते!<br>आज <span>क्या हल</span> करना है?</h2>
      
      <div class="hero-cards-grid">
        <div class="hero-card" onclick="promptDirect('चाल और वेग में क्या अंतर है? टेबल बनाकर समझाएं।')">
          <span class="icon">📊</span>
          <span class="heading">चाल vs वेग अंतर</span>
          <span class="sub">पूरी टेबल और मात्रक तुलना</span>
        </div>
        <div class="hero-card" onclick="promptDirect('न्यूटन के द्वितीय नियम सूत्र F = ma का पूरा डेरिवेशन चरणबद्ध तरीके से समझाइए।')">
          <span class="icon">🍎</span>
          <span class="heading">F = ma निगमन</span>
          <span class="sub">कक्षा 11th भौतिकी का मुख्य सूत्र</span>
        </div>
      </div>
    </div>

    <div class="chat-stream" id="chatStream" style="display: none;"></div>
  </main>

  <footer class="dock-wrapper">
    <div class="pill-dock">
      <button class="dock-btn" onclick="startFreshSession()" title="साफ़ करें">🗑️</button>
      <input type="text" id="mainInput" class="pill-input" placeholder="NischayDesk से पूछें..." onkeypress="if(event.key==='Enter') executeDoubt()">
      
      <div class="voice-bars" id="voiceBars">
        <div class="v-bar"></div>
        <div class="v-bar"></div>
        <div class="v-bar"></div>
        <div class="v-bar"></div>
      </div>

      <button class="dock-btn" id="micBtn" onclick="triggerVoice()" title="माइक">🎙️</button>
      <button class="send-pill-btn" onclick="executeDoubt()" title="भेजें">➔</button>
    </div>
  </footer>

  <script>
    const GROQ_KEY = "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";
    const ACTIVE_MODEL = "openai/gpt-oss-20b";

    const SYSTEM_PROMPT = `
You are "NischayDesk AI", built by Prince Kumar for Bihar Board Class 10th & 11th students.
Rules:
1. Identify as NischayDesk AI, created by Prince Kumar.
2. For all math/physics equations, use standard LaTeX enclosed strictly in $inline$ or $$display$$.
3. For comparisons, provide clean Markdown Tables.
`;

    function startFreshSession() {
      document.getElementById('geminiHero').style.display = 'flex';
      const stream = document.getElementById('chatStream');
      stream.style.display = 'none';
      stream.innerHTML = '';
      document.getElementById('mainInput').value = '';
    }

    function promptDirect(q) {
      document.getElementById('mainInput').value = q;
      executeDoubt();
    }

    function sanitizeFormulas(text) {
      return text.replace(/\\\[(.*?)\\\]/gs, '$$$$1$$')
                 .replace(/\\\((.*?)\\\)/gs, '$$$1$$')
                 .replace(/\[\s*(\\vec|\\boxed|\\text|\\frac|v|p|F)(.*?)\]/gs, '$$$1$2$$');
    }

    // Text to Speech
    function speakText(btn) {
      const text = btn.closest('.ai-document-response').innerText.replace(/🔊 सुनाएँ|📋 कॉपी/g, '');
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utt = new SpeechSynthesisUtterance(text);
        utt.lang = 'hi-IN';
        window.speechSynthesis.speak(utt);
      }
    }

    function copyText(btn) {
      const text = btn.closest('.ai-document-response').innerText.replace(/🔊 सुनाएँ|📋 कॉपी/g, '');
      navigator.clipboard.writeText(text);
      alert("उत्तर कॉपी हो गया! 📋");
    }

    // Voice recognition
    let recognizer;
    let isListening = false;

    function triggerVoice() {
      const bars = document.getElementById('voiceBars');
      const micBtn = document.getElementById('micBtn');
      const input = document.getElementById('mainInput');

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("कृपया मोबाइल में Google Chrome का उपयोग करें।");
        return;
      }

      if (isListening) {
        recognizer.stop();
        return;
      }

      recognizer = new SpeechRecognition();
      recognizer.lang = 'hi-IN';
      recognizer.interimResults = false;

      recognizer.onstart = () => {
        isListening = true;
        bars.classList.add('listening');
        micBtn.style.color = '#38bdf8';
        input.placeholder = "सुन रहा हूँ... बोलिए! 🎙️";
      };

      recognizer.onresult = (e) => {
        input.value = e.results[0][0].transcript;
        executeDoubt();
      };

      recognizer.onerror = recognizer.onend = () => {
        isListening = false;
        bars.classList.remove('listening');
        micBtn.style.color = '';
        input.placeholder = "NischayDesk से पूछें...";
      };

      try {
        recognizer.start();
      } catch (err) {
        recognizer.stop();
      }
    }

    async function executeDoubt() {
      const input = document.getElementById('mainInput');
      const hero = document.getElementById('geminiHero');
      const stream = document.getElementById('chatStream');
      const text = input.value.trim();

      if (!text) return;

      hero.style.display = 'none';
      stream.style.display = 'flex';

      stream.innerHTML += `<div class="user-entry">${text}</div>`;
      input.value = '';
      document.getElementById('mainViewport').scrollTop = document.getElementById('mainViewport').scrollHeight;

      const loaderId = "wave-" + Date.now();
      stream.innerHTML += `
        <div class="ai-document-response" id="${loaderId}">
          <div class="typing-wave">
            <span class="wave-dot"></span>
            <span class="wave-dot"></span>
            <span class="wave-dot"></span>
          </div>
        </div>
      `;
      document.getElementById('mainViewport').scrollTop = document.getElementById('mainViewport').scrollHeight;

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + GROQ_KEY,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: ACTIVE_MODEL,
            messages: [
              { role: "system", content: SYSTEM_PROMPT },
              { role: "user", content: text }
            ],
            temperature: 0.3
          })
        });

        const data = await response.json();
        const loaderElem = document.getElementById(loaderId);

        if (data.choices && data.choices[0]?.message?.content) {
          const raw = data.choices[0].message.content;
          const cleaned = sanitizeFormulas(raw);
          const parsedHTML = marked.parse(cleaned);

          // Wrap tables in responsive scrollable container
          const wrappedHTML = parsedHTML.replace(/<table>/g, '<div class="table-wrapper"><table>').replace(/<\/table>/g, '</table></div>');

          loaderElem.innerHTML = `
            <div>${wrappedHTML}</div>
            <div class="response-footer-actions">
              <button class="footer-action-btn" onclick="speakText(this)">🔊 सुनाएँ</button>
              <button class="footer-action-btn" onclick="copyText(this)">📋 कॉपी करें</button>
            </div>
          `;

          if (window.MathJax && window.MathJax.typesetPromise) {
            window.MathJax.typesetPromise([loaderElem]);
          }
        } else if (data.error) {
          loaderElem.innerHTML = `<span style="color:#f87171;">⚠️ Groq एरर: ${data.error.message}</span>`;
        }
      } catch (err) {
        const loaderElem = document.getElementById(loaderId);
        if (loaderElem) loaderElem.innerHTML = `<span style="color:#f87171;">⚠️ नेटवर्क समस्या!</span>`;
      }

      document.getElementById('mainViewport').scrollTop = document.getElementById('mainViewport').scrollHeight;
    }
  </script>
</body>
</html>
