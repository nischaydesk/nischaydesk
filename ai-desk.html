<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NischayDesk AI Studio</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- KaTeX for Math Equations -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <!-- Fast Client-Side PDF Generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --surface: #111827;
      --surface-elevated: #1a2234;
      --text-main: #f3f4f6;
      --text-muted: #94a3b8;
      --user-bubble: #1e293b;
      --border: rgba(56, 189, 248, 0.15);
      --input-bg: rgba(17, 24, 39, 0.95);
      --accent: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.35);
      --blue-btn: #0284c7;
      --code-bg: #050811;
      --table-border: rgba(56, 189, 248, 0.25);
      --table-header: rgba(56, 189, 248, 0.12);
    }

    html.light-mode {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-elevated: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --user-bubble: #e2e8f0;
      --border: #e2e8f0;
      --input-bg: rgba(255, 255, 255, 0.98);
      --accent: #0284c7;
      --primary-glow: rgba(2, 132, 199, 0.2);
      --blue-btn: #0284c7;
      --code-bg: #0f172a;
      --table-border: #cbd5e1;
      --table-header: #f1f5f9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.2s ease, color 0.2s ease;
      user-select: text;
    }

    /* TOP NAVBAR */
    .topbar-pro {
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      flex-shrink: 0;
      z-index: 50;
      border-bottom: 1px solid var(--border);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-back-link {
      color: var(--text-main);
      text-decoration: none;
      display: flex;
      align-items: center;
      padding: 6px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .brand-pill {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-top-util {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* FLOATING AUDIO FAB */
    .floating-audio-fab {
      position: fixed;
      top: 68px;
      right: 18px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #38bdf8;
      color: #040914;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 60;
      box-shadow: 0 4px 18px rgba(56, 189, 248, 0.45);
      border: 2px solid #ffffff;
      transition: all 0.25s ease;
    }
    .floating-audio-fab.speaking {
      animation: pulseFab 1.2s infinite alternate ease-in-out;
    }
    .floating-audio-fab.muted {
      background: #475569;
      color: #cbd5e1;
      box-shadow: none;
      border-color: #64748b;
    }
    @keyframes pulseFab {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.6); }
      100% { transform: scale(1.08); box-shadow: 0 0 0 10px rgba(56, 189, 248, 0); }
    }

    /* CHAT VIEWPORT */
    .chat-scroll-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 18px 16px 240px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 840px;
      width: 100%;
      margin: 0 auto;
    }

    .gemini-welcome {
      margin-top: 30px;
    }

    .gemini-welcome h1 {
      font-size: 2.3rem;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gemini-welcome p {
      font-size: 1.02rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .chips-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chip-item {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 0.94rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s;
    }
    .chip-item:hover {
      background: var(--surface-elevated);
      border-color: var(--accent);
    }

    /* Message Bubbles */
    .msg-user-row {
      display: flex;
      justify-content: flex-end;
      width: 100%;
    }

    .msg-user-bubble {
      background: var(--user-bubble);
      color: var(--text-main);
      padding: 13px 20px;
      border-radius: 22px;
      border-bottom-right-radius: 4px;
      max-width: 85%;
      font-size: 1rem;
      line-height: 1.6;
      word-break: break-word;
      border: 1px solid var(--border);
    }

    .msg-ai-row {
      display: flex;
      gap: 14px;
      width: 100%;
      align-items: flex-start;
    }

    .ai-sparkle-box {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      margin-top: 4px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    .ai-render-content {
      flex: 1;
      min-width: 0;
      font-size: 1.05rem;
      line-height: 1.85;
      color: var(--text-main);
      word-break: break-word;
    }

    .ai-render-content h1, .ai-render-content h2, .ai-render-content h3 {
      font-size: 1.22rem;
      font-weight: 800;
      margin: 18px 0 8px;
      color: #38bdf8;
    }

    .ai-render-content p { margin-bottom: 12px; }
    .ai-render-content ul, .ai-render-content ol { margin-left: 20px; margin-bottom: 12px; }
    .ai-render-content li { margin-bottom: 8px; }

    /* 📊 TABLES / CHARTS FORMATTING (सुंदर ग्रिड लेआउट, मोबाइल स्क्रॉल के साथ) */
    .table-container {
      width: 100%;
      overflow-x: auto;
      margin: 16px 0;
      border-radius: 12px;
      border: 1px solid var(--table-border);
      background: var(--surface);
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      scrollbar-width: thin;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 0.95rem;
    }

    th, td {
      padding: 10px 14px;
      border: 1px solid var(--table-border);
      white-space: nowrap;
    }

    th {
      background: var(--table-header);
      color: var(--accent);
      font-weight: 800;
      font-size: 0.98rem;
    }

    tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.02);
    }

    /* CODE BLOCK */
    .code-block-wrapper {
      background: var(--code-bg);
      border-radius: 16px;
      overflow: hidden;
      margin: 16px 0;
      border: 1px solid #1f2937;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .code-block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      background: #0b1120;
      border-bottom: 1px solid #1e293b;
      font-size: 0.82rem;
      color: #94a3b8;
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      font-weight: 700;
    }

    .btn-copy-code {
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .btn-copy-code:hover {
      color: #ffffff;
      background: #1e293b;
    }

    .code-block-wrapper pre {
      margin: 0;
      padding: 16px;
      overflow-x: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.94rem;
      line-height: 1.6;
      color: #e2e8f0;
    }

    /* Math Formulas */
    .katex-display {
      display: block !important;
      margin: 12px 0 !important;
      padding: 14px 18px !important;
      background: var(--surface) !important;
      border: 1px solid var(--border) !important;
      border-left: 4px solid var(--accent) !important;
      border-radius: 14px !important;
      overflow-x: auto !important;
      scrollbar-width: thin;
      text-align: left !important;
    }
    .katex { font-size: 1.15em !important; color: #38bdf8 !important; }

    /* ✍️ TYPEWRITER BLINKING CURSOR */
    .typewriter-cursor {
      display: inline-block;
      width: 8px;
      height: 18px;
      background: #38bdf8;
      margin-left: 4px;
      vertical-align: middle;
      animation: blinkCursor 0.75s infinite;
      border-radius: 2px;
    }
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Utility Tools Under AI Reply */
    .ai-bottom-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .btn-tool-icon {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 6px 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 12px;
      transition: all 0.15s;
    }
    .btn-tool-icon:hover {
      color: var(--text-main);
      background: var(--surface-elevated);
      border-color: var(--accent);
    }

    /* FLOATING LISTENING WAVE BAR */
    .floating-listening-bar {
      display: none;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.95);
      border: 1.5px solid #38bdf8;
      backdrop-filter: blur(16px);
      padding: 8px 18px;
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.35);
      margin-bottom: 8px;
      animation: popIn 0.25s ease-out;
    }
    .floating-listening-bar.active {
      display: inline-flex;
    }
    .listen-tag {
      font-size: 0.82rem;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }
    .listen-waves {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 24px;
    }
    .listen-wave-bar {
      width: 3.5px;
      background: linear-gradient(180deg, #38bdf8, #818cf8);
      border-radius: 4px;
      animation: waveDance 0.8s ease-in-out infinite alternate;
    }
    .listen-wave-bar:nth-child(1) { height: 10px; animation-delay: 0.1s; }
    .listen-wave-bar:nth-child(2) { height: 20px; animation-delay: 0.3s; }
    .listen-wave-bar:nth-child(3) { height: 26px; animation-delay: 0.5s; }
    .listen-wave-bar:nth-child(4) { height: 16px; animation-delay: 0.2s; }
    .listen-wave-bar:nth-child(5) { height: 22px; animation-delay: 0.4s; }
    @keyframes waveDance {
      0% { transform: scaleY(0.4); }
      100% { transform: scaleY(1.3); }
    }
    @keyframes popIn {
      0% { transform: translateY(10px) scale(0.9); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* FLOATING PILL DOCK */
    .dock-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: linear-gradient(to top, var(--bg) 80%, transparent);
      padding: 10px 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 100;
    }

    .gemini-pill-card {
      width: 100%;
      max-width: 760px;
      min-height: 58px;
      background: var(--input-bg);
      border: 1.5px solid var(--border);
      backdrop-filter: blur(20px);
      border-radius: 35px;
      padding: 6px 10px 6px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .gemini-pill-card:focus-within {
      border-color: var(--accent);
      box-shadow: 0 10px 35px var(--primary-glow);
    }

    .dock-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 1.05rem;
      font-family: inherit;
      color: var(--text-main);
    }
    .dock-input::placeholder { color: var(--text-muted); }

    .dock-icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .dock-icon-btn.recording {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
    }

    .btn-send-round {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border: 1px solid #38bdf8;
      color: #ffffff;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 4px 14px var(--primary-glow);
      transition: transform 0.15s;
    }
    .btn-send-round:active { transform: scale(0.92); }

    .loader-dots { display: inline-flex; gap: 6px; padding: 6px 0; }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; background: #38bdf8;
      animation: bounce 1.2s infinite ease-in-out both;
    }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0.3); opacity: 0.3; } 40% { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header class="topbar-pro">
    <div class="topbar-left">
      <a href="index.html" class="btn-back-link" title="होम">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>
      <div class="brand-pill">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" fill="url(#brandGrad)"/>
          <defs>
            <linearGradient id="brandGrad" x1="2" y1="2" x2="22" y2="22"><stop stop-color="#4285f4"/><stop offset="0.5" stop-color="#9b72cb"/><stop offset="1" stop-color="#d96570"/></linearGradient>
          </defs>
        </svg>
        <span>Nischay AI</span>
      </div>
    </div>
    <div class="topbar-right">
      <button class="btn-top-util" id="themeBtn" onclick="toggleTheme()">☀️ लाइट</button>
      <button class="btn-top-util" onclick="confirmClearChat()">🗑️ साफ करें</button>
    </div>
  </header>

  <!-- Floating Audio Player FAB -->
  <div class="floating-audio-fab" id="audioFab" onclick="toggleAudioFab()" title="आवाज़ चालू/बंद करें">
    <svg id="fabPlayIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <polygon points="5 3 19 12 5 21 5 3"></polygon>
    </svg>
    <svg id="fabPauseIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
      <rect x="6" y="4" width="4" height="16"></rect>
      <rect x="14" y="4" width="4" height="16"></rect>
    </svg>
  </div>

  <!-- Chat Viewport -->
  <main class="chat-scroll-area" id="chatArea">
    
    <div class="gemini-welcome" id="welcomeBox">
      <h1 id="userGreetingHeading">नमस्ते!</h1>
      <p>आज आप क्या समझना या हल करना चाहते हैं? पूछिए, तुरंत उत्तर मिलेगा।</p>

      <div class="chips-col">
        <div class="chip-item" onclick="askQuick('(A-B)^2 का सूत्र चरणबद्ध तरीके से सिद्ध कीजिए।')">
          📐 (A-B)² सूत्र चरणबद्ध तरीके से सिद्ध करें
        </div>
        <div class="chip-item" onclick="askQuick('गोलीय लेंस के लिए लेंस सूत्र 1/f = 1/v - 1/u का निगमन कीजिए।')">
          🔭 लेंस सूत्र का निगमन (5 मार्क्स बोर्ड स्पेशल)
        </div>
        <div class="chip-item" onclick="askQuick('त्रिकोणमिति के मानक कोणों के मान की पूरी टेबल बनाइए।')">
          📊 त्रिकोणमिति मानों की पूरी टेबल (Chart)
        </div>
      </div>
    </div>

    <div id="chatFeed" style="display:flex; flex-direction:column; gap:24px;"></div>

  </main>

  <!-- Floating Pill Dock -->
  <div class="dock-wrapper">
    <!-- Floating Listening Bar -->
    <div class="floating-listening-bar" id="floatingListeningBar">
      <div class="listen-waves">
        <div class="listen-wave-bar"></div>
        <div class="listen-wave-bar"></div>
        <div class="listen-wave-bar"></div>
        <div class="listen-wave-bar"></div>
        <div class="listen-wave-bar"></div>
      </div>
      <span class="listen-tag">सुन रहा हूँ... बोलिए</span>
    </div>

    <div class="gemini-pill-card" id="bottomDockCard">
      <!-- Input Field -->
      <input 
        type="text" 
        id="userInput" 
        class="dock-input" 
        placeholder="NischayDesk AI से पूछें..." 
        onkeypress="if(event.key==='Enter') sendUserQuery()"
        autocomplete="off"
      />

      <!-- Mic Button -->
      <button class="dock-icon-btn" id="micBtn" onclick="toggleVoiceInput()" title="बोलकर लिखें">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>

      <!-- Send Button -->
      <button class="btn-send-round" id="sendBtn" onclick="sendUserQuery()" title="भेजें">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <script>
    // 1. OBFUSCATED API KEY
    function getDecodedKey() {
      const _s = [70, 86, 51, 70, 103, 61, 87, 83, 59, 79, 94, 125, 110, 110, 110, 104, 95, 110, 121, 121, 122, 95, 83, 59, 80, 56, 112, 120, 111, 92, 111, 71, 119, 122, 115, 91, 79, 95, 60, 55, 115, 70, 113, 77, 75, 62, 50, 90, 108, 76, 53, 124, 86];
      return _s.map(c => String.fromCharCode(c - 5)).join('');
    }

    // 2. Custom Renderers (Code + Tables)
    const renderer = new marked.Renderer();
    renderer.code = function(code, language) {
      const validLang = language || 'code';
      const cleanCode = typeof code === 'object' ? (code.text || '') : code;
      const escaped = escapeHtml(cleanCode);
      return `
        <div class="code-block-wrapper">
          <div class="code-block-header">
            <span>${validLang}</span>
            <button class="btn-copy-code" onclick="copySnippet(this)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              <span>कॉपी</span>
            </button>
          </div>
          <pre><code>${escaped}</code></pre>
        </div>
      `;
    };

    // टेबल को स्क्रॉल कंटेनर में रैप करें
    renderer.table = function(header, body) {
      return `
        <div class="table-container">
          <table>
            <thead>${header}</thead>
            <tbody>${body}</tbody>
          </table>
        </div>
      `;
    };

    marked.setOptions({ renderer: renderer });

    function copySnippet(btn) {
      const codeText = btn.closest('.code-block-wrapper').querySelector('pre code').innerText;
      navigator.clipboard.writeText(codeText);
      const span = btn.querySelector('span');
      span.innerText = "कॉपी हो गया!";
      setTimeout(() => span.innerText = "कॉपी", 1500);
    }

    // 3. Greeting (Session Only)
    (function loadUser() {
      const stored = sessionStorage.getItem('nischay_user_name') || "";
      const head = document.getElementById('userGreetingHeading');
      if (stored && stored.trim()) {
        const first = stored.trim().split(' ')[0];
        head.innerHTML = `नमस्ते, <span style="color:#38bdf8;">${escapeHtml(first)}</span>!`;
      }
    })();

    // 4. Theme
    function syncTheme() {
      const isLight = document.documentElement.classList.contains('light-mode');
      document.getElementById('themeBtn').innerText = isLight ? '🌙 डार्क' : '☀️ लाइट';
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('light-mode');
      syncTheme();
    }

    // 5. Speech Synthesizer
    let isVoiceActive = true;
    let naturalHindiVoice = null;
    let isSpeaking = false;
    let lastSpokenText = "";

    function initVoices() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      naturalHindiVoice = 
        voices.find(v => v.lang === 'hi-IN' && (v.name.includes('Google') || v.name.includes('Neural') || v.name.includes('Natural'))) ||
        voices.find(v => v.lang === 'hi-IN') ||
        voices[0];
    }
    initVoices();
    if (window.speechSynthesis && window.speechSynthesis.onvoiceschanged !== undefined) {
      window.speechSynthesis.onvoiceschanged = initVoices;
    }

    function toggleAudioFab() {
      if (!('speechSynthesis' in window)) return;
      
      const fab = document.getElementById('audioFab');
      const playIcon = document.getElementById('fabPlayIcon');
      const pauseIcon = document.getElementById('fabPauseIcon');

      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        isSpeaking = false;
        fab.classList.remove('speaking');
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      } else if (lastSpokenText) {
        speakText(lastSpokenText);
      } else {
        isVoiceActive = !isVoiceActive;
        fab.classList.toggle('muted', !isVoiceActive);
      }
    }

    function stopSpeakingImmediately() {
      if ('speechSynthesis' in window && window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
      }
      isSpeaking = false;
      const fab = document.getElementById('audioFab');
      if (fab) {
        fab.classList.remove('speaking');
        document.getElementById('fabPlayIcon').style.display = 'block';
        document.getElementById('fabPauseIcon').style.display = 'none';
      }
    }

    function speakText(txt) {
      if (!isVoiceActive || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      lastSpokenText = txt;
      const clean = txt
        .replace(/\$\$(.*?)\$\$/gs, ' ')
        .replace(/\$(.*?)\$/g, ' ')
        .replace(/```[\s\S]*?```/g, ' कोड उपलब्ध है। ')
        .replace(/\\\[(.*?)\\\]/gs, ' ')
        .replace(/\\times/g, ' गुणा ')
        .replace(/[#*`_~\[\]\\]/g, '')
        .replace(/\n+/g, '। ')
        .trim();

      if (!clean) return;
      
      const utt = new SpeechSynthesisUtterance(clean);
      if (naturalHindiVoice) utt.voice = naturalHindiVoice;
      utt.lang = 'hi-IN';
      utt.rate = 1.05;
      utt.pitch = 1.0;

      const fab = document.getElementById('audioFab');
      const playIcon = document.getElementById('fabPlayIcon');
      const pauseIcon = document.getElementById('fabPauseIcon');

      utt.onstart = () => {
        isSpeaking = true;
        fab.classList.add('speaking');
        fab.classList.remove('muted');
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
      };

      utt.onend = utt.onerror = () => {
        isSpeaking = false;
        fab.classList.remove('speaking');
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      };

      window.speechSynthesis.speak(utt);
    }

    // 6. Model Config
    const MODEL_NAME = "gemini-3.5-flash-lite";
    let isBusy = false;

    const SYSTEM_INSTRUCTION_TEXT = `You are NischayDesk AI, a premier academic AI tutor for Bihar Board (BSEB Matric & Inter Science) students.

CRITICAL INSTRUCTIONS:
1. DIRECT ANSWERING: Answer directly without unnecessary greetings.
2. CREATOR CONFIDENTIALITY: Mention "Prince Kumar" ONLY IF the user explicitly asks "who created you?" or "developer kaun hai?". Otherwise, never mention it.
3. MATHEMATICAL FORMULAS: Format every formula and equation in clean LaTeX display math blocks with "$$":
$$ (A - B)^2 = A^2 - 2AB + B^2 $$
4. TABLES & CHARTS: When asked for charts, trigonometry values, formulas list, or comparisons, ALWAYS use clean Markdown Table format (| Header 1 | Header 2 |) with all rows cleanly aligned. Do not output values as plain messy text.
5. CODE BLOCKS: Always format code with language fences like:
\`\`\`html
<!-- code -->
\`\`\`
6. TONE: Clear, structured, encouraging, and natural Hindi.`;

    let chatMemory = [];

    function askQuick(q) {
      document.getElementById('userInput').value = q;
      sendUserQuery();
    }

    function normalizeFormulas(raw) {
      if (!raw) return "";
      let clean = raw.replace(/(?:^|\n)\s*\[\s*([\s\S]*?)\s*\](?:\s*(?:\n|$))/g, function(match, inner) {
        if (inner.includes('\\times') || inner.includes('^') || inner.includes('=') || inner.includes('-') || inner.includes('+')) {
          return '\n\n$$' + inner.trim() + '$$\n\n';
        }
        return match;
      });
      clean = clean.replace(/\\\[([\s\S]*?)\\\]/g, '\n\n$$ $1$$\n\n');
      return clean;
    }

    function renderKaTeXSafe(elem) {
      if (window.renderMathInElement) {
        window.renderMathInElement(elem, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }

    function copyFullAIText(btn) {
      const txt = btn.closest('.ai-render-content').querySelector('.slot-text').innerText;
      navigator.clipboard.writeText(txt);
      alert("पूरा उत्तर कॉपी हो गया! 📋");
    }

    function speakFromBtn(btn) {
      const txt = btn.closest('.ai-render-content').querySelector('.slot-text').innerText;
      speakText(txt);
    }

    // PDF Generator
    function downloadResponsePdf(btn) {
      const contentElem = btn.closest('.ai-render-content').querySelector('.slot-text');
      
      const opt = {
        margin:       12,
        filename:     `NischayDesk_Notes_${new Date().toISOString().slice(0,10)}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      const originalBtnText = btn.innerHTML;
      btn.innerHTML = "⏳ PDF बन रही है...";
      btn.disabled = true;

      html2pdf().set(opt).from(contentElem).save().then(() => {
        btn.innerHTML = originalBtnText;
        btn.disabled = false;
      }).catch(err => {
        alert("PDF बनाने में त्रुटि हुई: " + err.message);
        btn.innerHTML = originalBtnText;
        btn.disabled = false;
      });
    }

    // 7. ✍️ SMART TYPEWRITER ANIMATION ENGINE (एक-एक टाइप होता हुआ दिखेगा)
    function typewriteResponse(slot, fullText, onFinish) {
      let index = 0;
      const step = Math.max(3, Math.floor(fullText.length / 80)); // स्मूथ स्पीड
      slot.innerHTML = `<span class="typed-content"></span><span class="typewriter-cursor"></span>`;
      
      const contentSpan = slot.querySelector('.typed-content');
      const cursorSpan = slot.querySelector('.typewriter-cursor');

      const normalized = normalizeFormulas(fullText);

      function typeTick() {
        if (index < normalized.length) {
          index += step;
          contentSpan.innerHTML = marked.parse(normalized.slice(0, index));
          smoothScrollBottom();
          requestAnimationFrame(typeTick);
        } else {
          if (cursorSpan) cursorSpan.remove();
          contentSpan.innerHTML = marked.parse(normalized);
          renderKaTeXSafe(contentSpan);
          smoothScrollBottom();
          if (onFinish) onFinish();
        }
      }
      typeTick();
    }

    // 8. SEND USER QUERY
    async function sendUserQuery() {
      const input = document.getElementById('userInput');
      const feed = document.getElementById('chatFeed');
      const welcome = document.getElementById('welcomeBox');
      const q = input.value.trim();

      if (!q || isBusy) return;

      if (welcome) welcome.style.display = 'none';

      feed.innerHTML += `
        <div class="msg-user-row">
          <div class="msg-user-bubble">${escapeHtml(q)}</div>
        </div>`;

      input.value = '';
      smoothScrollBottom();

      chatMemory.push({ role: "user", content: q });
      if (chatMemory.length > 20) chatMemory = chatMemory.slice(-16);

      isBusy = true;
      const loadId = 'ai-resp-' + Date.now();

      feed.innerHTML += `
        <div class="msg-ai-row" id="${loadId}">
          <div class="ai-sparkle-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/></svg>
          </div>
          <div class="ai-render-content">
            <div class="slot-text"><span class="loader-dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></div>
            <div class="ai-bottom-tools" style="display:none;">
              <button class="btn-tool-icon" onclick="copyFullAIText(this)">📋 कॉपी करें</button>
              <button class="btn-tool-icon" onclick="speakFromBtn(this)">🔊 सुनाएँ</button>
              <button class="btn-tool-icon" onclick="downloadResponsePdf(this)" style="border-color: #38bdf8; color: #38bdf8;">📄 PDF डाउनलोड करें</button>
            </div>
          </div>
        </div>
      `;
      smoothScrollBottom();

      const aiRow = document.getElementById(loadId);
      const slot = aiRow.querySelector('.slot-text');
      const tools = aiRow.querySelector('.ai-bottom-tools');

      try {
        const geminiContents = chatMemory.map(m => ({
          role: m.role === 'model' ? 'model' : 'user',
          parts: [{ text: m.content }]
        }));

        const activeKey = getDecodedKey();
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${activeKey}`;
        
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            "x-goog-api-key": activeKey
          },
          body: JSON.stringify({
            contents: geminiContents,
            system_instruction: { parts: [{ text: SYSTEM_INSTRUCTION_TEXT }] },
            generationConfig: {
              temperature: 0.25,
              maxOutputTokens: 2048
            }
          })
        });

        const resData = await response.json();

        if (!response.ok) {
          throw new Error(resData.error?.message || `HTTP ${response.status}`);
        }

        const answer = resData.candidates?.[0]?.content?.parts?.[0]?.text;

        if (answer) {
          chatMemory.push({ role: "model", content: answer });

          // 🌟 टाइपराइटर एनीमेशन के साथ टाइप होना
          typewriteResponse(slot, answer, () => {
            tools.style.display = 'flex';
            smoothScrollBottom();
            if (isVoiceActive) speakText(answer);
          });
        } else {
          slot.innerHTML = `<span style="color:#ef4444; font-weight:700;">⚠️ कोई उत्तर प्राप्त नहीं हुआ।</span>`;
        }

      } catch (err) {
        console.error(err);
        slot.innerHTML = `<span style="color:#ef4444; font-weight:700;">⚠️ त्रुटि: ${escapeHtml(err.message)}</span>`;
      } finally {
        isBusy = false;
        smoothScrollBottom();
      }
    }

    // 9. SPEECH-TO-TEXT WITH LIVE WAVE BAR & AUTO-MUTE
    let recognition;
    let isRec = false;

    function toggleVoiceInput() {
      const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Speech) {
        alert("कृपया Google Chrome का उपयोग करें।");
        return;
      }

      const micBtn = document.getElementById('micBtn');
      const input = document.getElementById('userInput');
      const listenBar = document.getElementById('floatingListeningBar');

      if (isRec) {
        if (recognition) recognition.stop();
        isRec = false;
        micBtn.classList.remove('recording');
        listenBar.classList.remove('active');
        return;
      }

      // 🛑 1. माइक चालू होते ही AI का बोलना तुरंत बंद हो जाए
      stopSpeakingImmediately();

      recognition = new Speech();
      recognition.lang = 'hi-IN';

      recognition.onstart = () => {
        isRec = true;
        micBtn.classList.add('recording');
        listenBar.classList.add('active'); // 🌟 फ्लोटिंग वेव बार दिखेगा
      };

      recognition.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        const currentVal = input.value.trim();
        input.value = currentVal ? `${currentVal} ${transcript}` : transcript;
        input.focus();
      };

      recognition.onerror = recognition.onend = () => {
        isRec = false;
        micBtn.classList.remove('recording');
        listenBar.classList.remove('active');
      };

      recognition.start();
    }

    function confirmClearChat() {
      if (confirm("क्या आप पूरी चैट मिटाना चाहते हैं?")) {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        document.getElementById('chatFeed').innerHTML = '';
        document.getElementById('welcomeBox').style.display = 'block';
        chatMemory = [];
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function smoothScrollBottom() {
      const vp = document.getElementById('chatArea');
      vp.scrollTo({ top: vp.scrollHeight, behavior: 'smooth' });
    }
  </script>
</body>
